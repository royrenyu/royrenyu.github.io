name: Seed index.html

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull page source
        run: |
          set -e
          SRC="https://4mk1gaxbp8n2r.doubao.link/app/app_17jnv90kh30"
          curl -fsSL --retry 3 --max-time 90 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" \
            "$SRC" -o page.raw.html
          wc -c page.raw.html

      - name: Sanitize
        run: python3 .github/sanitize.py

      - name: Fetch usage poster
        run: |
          mkdir -p assets
          curl -fsSL --retry 3 --max-time 120 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" \
            "https://aka.doubaocdn.com/s/Ck0aZyl3A0" -o assets/usage.png || echo "poster fetch failed (kept previous)"
          ls -l assets/usage.png || true
          file assets/usage.png || true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f page.raw.html
          SIZE=$(wc -c < index.html)
          git add index.html
          [ -f assets/usage.png ] && git add assets/usage.png
          if git diff --cached --quiet; then
            echo "no change (index $SIZE bytes)"
          else
            git commit -m "seed: sync index (bytes=$SIZE) + usage poster"
            git push
          fi
