name: Seed index.html

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull page source
        run: |
          set -e
          SRC="https://4mk1gaxbp8n2r.doubao.link/app/app_17jnv90kh30"
          curl -fsSL --retry 3 --max-time 90 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" \
            "$SRC" -o page.raw.html
          wc -c page.raw.html

      - name: Sanitize
        run: python3 .github/sanitize.py

      - name: Report
        run: |
          echo "--- result ---"
          wc -c index.html
          echo "title hits: $(grep -c 狼人杀 index.html || true)"
          echo "slardar hits: $(grep -c Slardar index.html || true)"
          echo "tail iframe hits: $(grep -c miaoda-html-comment index.html || true)"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f page.raw.html
          git add index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "seed: sync clean index.html"
            git push
          fi
