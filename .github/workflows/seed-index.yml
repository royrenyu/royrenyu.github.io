name: Seed index.html

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull and sanitize page
        run: |
          set -e
          SRC="https://4mk1gaxbp8n2r.doubao.link/app/app_17jnv90kh30"
          curl -fsSL --retry 3 --max-time 90 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            "$SRC" -o page.raw.html
          bytes=$(wc -c < page.raw.html)
          echo "raw bytes: $bytes"
          test "$bytes" -gt 50000
          grep -q "狼人杀" page.raw.html
          python3 - <<'PY'
          import re
          s = open('page.raw.html', encoding='utf-8', errors='replace').read()

          # 1) 去掉 </html> 之后平台追加的内容（评论 iframe 等）
          i = s.lower().rfind('</html>')
          if i > 0:
              s = s[:i + 7]

          # 2) 去掉 <head> 之后、<meta charset> 之前被塞入的埋点脚本
          head = s.lower().find('<head>')
          meta = s.lower().find('<meta charset')
          if head > 0 and meta > head and s[head + 6:meta].strip():
              s = s[:head + 6] + '\n' + s[meta:]

          # 3) 去掉平台加的属性
          s = re.sub(r'\s+data-inspector-id="[^"]*"', '', s)
          s = re.sub(r'\s+data-src-ver="[^"]*"', '', s)
          s = re.sub(r'\s+data-inspect-html="[^"]*"', '', s)

          open('index.html', 'w', encoding='utf-8').write(s)
          print('cleaned chars:', len(s))
          print('has head scripts:', bool(re.search(r'<head>\s*<script', s, re.I)))
          PY
          grep -q "狼人杀" index.html
          grep -q "</html>" index.html
          bytes2=$(wc -c < index.html)
          echo "final bytes: $bytes2"
          test "$bytes2" -lt 200000

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f page.raw.html
          git add index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "seed: sync clean index.html"
            git push
          fi
