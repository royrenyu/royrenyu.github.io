    hintEl.style.color = '';
    const wtxt = cfg.wolves.length
      ? cfg.wolves.map(k=>ROLES[k].name).join(' / ') + ' + ' + normal + ' 普通狼'
      : cfg.wolfTotal + ' 普通狼';
    const gtxt = cfg.gods.length ? cfg.gods.map(k=>ROLES[k].name).join(' / ') : '无神职';
    hintEl.textContent = '共 '+cfg.total+' 人 ＝ '+cfg.wolfTotal+' 狼（'+wtxt+'）· '+cfg.gods.length+' 神（'+gtxt+'）· '+vil+' 民';
  }

  function resizeNames(target){
    const lines = nameInput.value.split('\n').map(s=>s.trim()).filter(s=>s !== '');
    const out = [];
    for(let i=0;i<target;i++) out.push(lines[i] || (i+1)+'号位');
    nameInput.value = out.join('\n');
    nameHintEl.textContent = '座位 1 在最前面。当前名单 ' + target + ' 人。';
  }

  function refreshChips(){
    root.querySelector('#wolfChips').innerHTML = wolfChipsHTML();
    root.querySelector('#godChips').innerHTML = godChipsHTML();
  }

  function autoConfig(){
    const t = cfg.total;
    const w = Math.max(2, Math.round(t * 0.3));
    const rest = t - w;
    const g = Math.min(GOD_POOL.length, Math.max(1, Math.floor(rest / 2)));
    cfg.wolfTotal = w;
    cfg.gods = GOD_POOL.slice(0, g);
    root.querySelector('#cWolfN').value = w;
    refreshChips();
    sync();
  }

  sync();

  root.querySelector('#boardOpts').addEventListener('click', e=>{
    const o = e.target.closest('.board-opt');
    if(!o) return;
    const k = o.dataset.board;
    const b = BOARDS[k];
    cfg.key = k;
    cfg.total = b.total;
    cfg.wolfTotal = b.wolves.length;
    cfg.wolves = b.wolves.filter(x=>x!=='wolf');
    cfg.gods = b.gods.slice();
    root.querySelectorAll('.board-opt').forEach(x=>x.classList.toggle('on', x.dataset.board === k));
    root.querySelector('#cTotal').value = cfg.total;
    root.querySelector('#cWolfN').value = cfg.wolfTotal;
    refreshChips();
    sync();
    resizeNames(cfg.total);
  });

  root.querySelector('#cTotal').addEventListener('input', e=>{
    cfg.total = Math.max(4, Math.min(30, +e.target.value || 4));
    cfg.wolfTotal = Math.max(2, Math.round(cfg.total * 0.3));
    root.querySelector('#cWolfN').value = cfg.wolfTotal;
    // 狼位变多后，若神位放不下就自动裁掉末尾的神
    const maxGods = Math.max(0, cfg.total - cfg.wolfTotal);
    if(cfg.gods.length > maxGods) cfg.gods = cfg.gods.slice(0, maxGods);
    if(cfg.wolves.length > cfg.wolfTotal) cfg.wolves = cfg.wolves.slice(0, cfg.wolfTotal);
    refreshChips();
    sync();
    resizeNames(cfg.total);
  });

  root.querySelector('#cWolfN').addEventListener('input', e=>{
    cfg.wolfTotal = Math.max(1, Math.min(15, +e.target.value || 1));
    sync();
  });

  root.querySelector('#cAuto').addEventListener('click', autoConfig);

  root.querySelector('#wolfChips').addEventListener('click', e=>{
    const b = e.target.closest('[data-wk]');
    if(!b) return;
    const k = b.dataset.wk;
    const i = cfg.wolves.indexOf(k);
    if(i >= 0){ cfg.wolves.splice(i,1); b.classList.remove('on'); }
    else {
      if(cfg.wolves.length + 1 > cfg.wolfTotal){ toast('狼位不够：先把狼人数量调大，或取消其他特殊狼'); return; }
      cfg.wolves.push(k); b.classList.add('on');
    }
    sync();
  });

  root.querySelector('#godChips').addEventListener('click', e=>{
    const b = e.target.closest('[data-gk]');
    if(!b) return;
    const k = b.dataset.gk;
    const i = cfg.gods.indexOf(k);
    if(i >= 0){ cfg.gods.splice(i,1); b.classList.remove('on'); }
    else {
      if(cfg.total - cfg.wolfTotal - (cfg.gods.length + 1) < 0){ toast('总人数不够，先调大总人数或减少狼人'); return; }
      cfg.gods.push(k); b.classList.add('on');
    }
    sync();
  });

  const extraBox = root.querySelector('#extraBox');
  function rerenderExtra(){ extraBox.innerHTML = extraHTML(); }

  root.querySelector('#cAddExtra').addEventListener('click', ()=>{
    cfg.extra.push({name:'', camp:'god', count:1, wake:false, order:5.5});
    rerenderExtra();
  });
  extraBox.addEventListener('input', e=>{
    const t = e.target;
    if(t.dataset.xname !== undefined){ cfg.extra[+t.dataset.xname].name = t.value; }
    else if(t.dataset.xcount !== undefined){ cfg.extra[+t.dataset.xcount].count = Math.max(1, Math.min(6, +t.value || 1)); }
  });
  extraBox.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.xcamp !== undefined){ cfg.extra[+t.dataset.xcamp].camp = t.value; }
    if(t.dataset.xwake !== undefined){ cfg.extra[+t.dataset.xwake].wake = t.checked; }
  });
  extraBox.addEventListener('click', e=>{
    const del = e.target.closest('[data-xdel]');
    if(del){ cfg.extra.splice(+del.dataset.xdel, 1); rerenderExtra(); }
  });

  root.querySelector('#modeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button[data-mode]');
    if(!b) return;
    mode = b.dataset.mode;
    root.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on', x.dataset.mode === mode));
  });

  const finish = () => {
    const names = nameInput.value.split('\n').map(s=>s.trim());
    const sec = Math.max(15, Math.min(600, parseInt(root.querySelector('#speakInput').value) || 90));
    const normal = cfg.wolfTotal - cfg.wolves.length;
    const vil = cfg.total - cfg.wolfTotal - cfg.gods.length;
    if(normal < 0){ toast('特殊狼超过狼位，请调整'); return; }
    if(vil < 0){ toast('狼 + 神超过总人数，请调整'); return; }

    const extraArr = cfg.extra
      .filter(x=>(x.name||'').trim() !== '' && (x.count||0) > 0)
      .map((x,i)=>({
        key:'cx'+i,
        name: x.name.trim(),
        badge: x.name.trim().slice(0,1),
        camp: x.camp || 'god',
        count: x.count,
        wake: !!x.wake,
        order: x.order || 5.5
      }));

    const wolvesArr = [];
    for(let i=0;i<normal;i++) wolvesArr.push('wolf');
    cfg.wolves.forEach(k=>wolvesArr.push(k));

    const cfgOut = {
      key: 'custom',
      name: '自定义局（'+cfg.total+' 人）',
      total: cfg.total,
      wolves: wolvesArr,
      gods: cfg.gods.slice(),
      extra: extraArr
    };

    state = createState(cfgOut, names);
    state.mode = mode;
    state.speakSeconds = sec;
    tReset(sec);
    closeModal();
    log('开局：' + state.boardName + '（' + (mode==='side'?'屠边':'屠城') + '），共 ' + state.players.length
      + ' 人 · ' + state.census.wolf + ' 狼 / ' + state.census.god + ' 神职 / ' + state.census.vil + ' 民', 'sys');
    renderAll();
    if(room && room.id) pushIdentities(true);
    else toast('发牌完成，点「发牌台」让每人看自己的身份');
  };

  root.querySelector('#mStart').addEventListener('click', finish);
  const c = root.querySelector('#mCancel') || root.querySelector('#mClose');
  if(c) c.addEventListener('click', closeModal);
}

/* ---------- 发牌台 ---------- */
function openDeal(){
  const total = state.players.length;
  let idx = 0;
  let view = 'single';

  const html = '<div class="modal-head"><h3>发牌台</h3><div class="spacer"></div>'
    + '<div class="seg" style="flex:1 1 150px;max-width:196px" id="dealModeSeg">'
    + '<button data-dm="single" class="on">逐张看牌</button>'
    + '<button data-dm="grid">网格总览</button></div>'
    + '<button class="btn btn-sm" id="dClose" style="margin-left:10px">关闭</button></div>'
    + '<div class="modal-body" id="dealBody"></div>'
    + '<div class="modal-foot">'
    + '<span style="flex:1;font-size:12px;color:var(--dim);align-self:center" id="dealFoot"></span>'
    + '<button class="btn btn-primary" id="dDone">发牌完毕</button></div>';

  const root = modal(html, 700);
  const bodyEl = root.querySelector('#dealBody');

  function singleHTML(){
    const p = state.players[idx];
    const on = state.revealed[p.seat];
    const isGeneric = p.name === (p.seat + '号位');
    return '<div class="deal-single">'
      + '<div class="ds-title">'+fmtSeat(p.seat)+' 号位'+(isGeneric ? '' : ' · <span>'+esc(p.name)+'</span>')+'</div>'
      + '<div class="ds-sub">把设备递给这位玩家，由 ta 自己点开卡片查看身份</div>'
      + '<div class="bigcard'+(on?' flip':'')+'" data-flip="1">'
      + '<div class="bf-seat">'+fmtSeat(p.seat)+'</div>'
      + (on
          ? '<div class="bf-role" style="color:'+ROLE_COLOR[p.role]+'">'+ROLES[p.role].name+'</div>'
            + '<div class="bf-hint">'+ROLES[p.role].badge+'</div>'
          : '<div class="bf-q">?</div><div class="bf-hint">TAP TO REVEAL</div>')
      + '</div>'
      + '<div class="ds-progress">'+ (idx+1) + ' / ' + total + '</div>'
      + '<div class="btn-row" style="width:250px">'
      + '<button class="btn" data-dnav="-1" '+(idx===0?'disabled':'')+'>上一位</button>'
      + '<button class="btn btn-primary" data-dnav="1">'+(idx===total-1?'盖上并完成':'盖上并下一位')+'</button>'
      + '</div></div>';
  }

  function gridHTML(){
    const cards = state.players.map(p=>{
      const on = state.revealed[p.seat];
      return '<div class="card'+(on?' flip':'')+'" data-deal="'+p.seat+'">'
        + '<span class="cn">'+fmtSeat(p.seat)+'</span>'
        + (on
            ? '<div class="role-big" style="color:'+ROLE_COLOR[p.role]+'">'+ROLES[p.role].name+'</div>'
              + '<div class="role-sub">'+fmtSeat(p.seat)+' 号位</div>'
              + '<div class="pname">'+esc(p.name)+'</div>'
            : '<div class="q">?</div><div class="back-txt">WEREWOLF</div>')
        + '</div>';
    }).join('');
    return '<div class="hint" style="font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.7">'
      + '上帝总览视图：可一次性核对全部身份。<strong>确认身边没有玩家时再打开</strong>，共 '+total+' 人。</div>'
      + '<div class="deal-grid">'+cards+'</div>';
  }

  function render(){
    bodyEl.innerHTML = view === 'single' ? singleHTML() : gridHTML();
    const f = root.querySelector('#dealFoot');
    if(f) f.textContent = view === 'single'
      ? '玩法：把设备递给该玩家，让他自己点开卡片；看完盖上再传给下一位。'
      : '注意：网格总览会同时显示全部身份，只适合上帝单独核对。';
    root.querySelectorAll('#dealModeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.dm === view));
    save();
  }

  render();

  root.querySelector('#dealModeSeg').addEventListener('click', e=>{
    const b = e.target.closest('[data-dm]');
    if(!b) return;
    view = b.dataset.dm;
    render();
  });

  bodyEl.addEventListener('click', e=>{
    const flip = e.target.closest('[data-flip]');
    if(flip){
      const p = state.players[idx];
      state.revealed[p.seat] = !state.revealed[p.seat];
      beep(state.revealed[p.seat] ? 720 : 420, .08, .12);
      render();
      return;
    }
    const nav = e.target.closest('[data-dnav]');
    if(nav){
      state.revealed[state.players[idx].seat] = false;   // 看完自动盖上
      const next = idx + (+nav.dataset.dnav);
      if(next >= total){
        toast('全部 ' + total + ' 位玩家已看完牌');
      }else{
        idx = next < 0 ? 0 : next;
      }
      render();
      return;
    }
    const card = e.target.closest('[data-deal]');
    if(card){
      const seat = +card.dataset.deal;
      state.revealed[seat] = !state.revealed[seat];
      beep(state.revealed[seat] ? 720 : 420, .08, .12);
      render();
    }
  });

  root.querySelector('#dClose').addEventListener('click', closeModal);
  root.querySelector('#dDone').addEventListener('click', ()=>{
    state.players.forEach(p=>state.revealed[p.seat] = false);
    closeModal(); renderAll();
    toast('发牌完毕，可以开始第一夜了');
  });
}

function copyLog(){
  if(!state.logs.length){ toast('还没有日志'); return; }
  const txt = '狼人杀复盘日志 · ' + (state.boardName || '对局') + '\n'
    + state.players.filter(p=>!p.alive).map(p=>'出局：'+fmtSeat(p.seat)+'号 '+p.name+'（'+CAUSE_LABEL[p.death.cause]+'，第'+p.death.day+(p.death.phase==='night'?'夜':'天')+'）').join('\n')
    + '\n----------\n'
    + state.logs.map(l=>'['+l.t+'] '+l.text).join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('日志已复制到剪贴板')).catch(()=>fallbackCopy(txt));
  }else{
    fallbackCopy(txt);
  }
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('日志已复制'); }
  catch(e){ toast('复制失败，请手动选中日志区'); }
  ta.remove();
}

const CLOUD_API = 'https://extendsclass.com/api/json-storage/bin';
const ROOM_LS = 'ww_room_v1';
const SEAT_LS = 'ww_myseat_';
const CID_LS = 'ww_cid';

let room = (function(){
  try{ const v = JSON.parse(localStorage.getItem(ROOM_LS) || 'null'); return (v && v.id) ? v : null; }catch(e){ return null; }
})();
let roomCache = null;
let roomPoll = null;

function writeRoom(r){
  room = r || null;
  try{
    if(room) localStorage.setItem(ROOM_LS, JSON.stringify(room));
    else localStorage.removeItem(ROOM_LS);
  }catch(e){}
}
function clientId(){
  let c = null;
  try{ c = localStorage.getItem(CID_LS); }catch(e){}
  if(!c){
    c = 'c' + Math.random().toString(36).slice(2,9) + Math.random().toString(36).slice(2,5);
    try{ localStorage.setItem(CID_LS, c); }catch(e){}
  }
  return c;
}
async function cloudFetch(url, opt){
  const ac = new AbortController();
  const tm = setTimeout(()=>ac.abort(), 10000);
  try{ return await fetch(url, Object.assign({}, opt, {signal: ac.signal})); }
  finally{ clearTimeout(tm); }
}
function parseLoose(text){
  const s = String(text).trim();
  const start = s.indexOf('{');
  if(start < 0) return null;
  let depth = 0, end = -1;
  for(let i=start;i<s.length;i++){
    if(s[i] === '{') depth++;
    else if(s[i] === '}'){ depth--; if(depth === 0){ end = i; break; } }
  }
  if(end < 0) return null;
  try{ return JSON.parse(s.slice(start, end + 1)); }catch(e){ return null; }
}
async function cloudCreate(data){
  const r = await cloudFetch(CLOUD_API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = parseLoose(await r.text());
  if(!j || !j.id) throw new Error('返回异常');
  return j.id;
}
async function cloudGet(id){
  const r = await cloudFetch(CLOUD_API + '/' + id + '?r=' + Math.random().toString(36).slice(2), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = parseLoose(await r.text());
  if(!j) throw new Error('数据读取失败');
  return (j.data && typeof j.data === 'object') ? j.data : j;
}
async function cloudPut(id, data){
  const r = await cloudFetch(CLOUD_API + '/' + id, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}
function roomLink(id){
  let base = location.href.split('#')[0];
  try{ base = decodeURI(base); }catch(e){}
  return base + '#room=' + id;
}
function seatNames(d, total){
  const seats = (d && d.seats) || {};
  const out = [];
  for(let i=1;i<=total;i++){
    const s = seats[String(i)];
    out.push(s && s.n ? s.n : (i + '号位'));
  }
  return out;
}
function hashRoomId(){
  const m = /room=([A-Za-z0-9_\-]+)/.exec(location.hash || '');
  return m ? m[1] : null;
}

/* ---------- 上帝端：把本局身份推到云端 ---------- */
async function pushIdentities(silent){
  if(!room || !room.id) return false;
  if(!state || !state.players || !state.players.length){ toast('先开局，再同步身份'); return false; }
  const ids = {};
  state.players.forEach(p=>{ ids[p.seat] = p.role; });
  try{
    let base = roomCache;
    if(!base) base = await cloudGet(room.id);
    const seatsSrc = (base && base.seats) || {};
    const seats = {};
    Object.keys(seatsSrc).forEach(k=>{ if(+k >= 1 && +k <= state.players.length) seats[k] = seatsSrc[k]; });
    await cloudPut(room.id, {
      total: state.players.length,
      seats, ids,
      locked: true,
      ts: Date.now()
    });
    roomCache = null;
    toast(silent ? '身份已同步，玩家可以在手机上翻牌了' : '身份已同步到玩家手机');
    return true;
  }catch(e){
    toast('身份同步失败：' + (e.message || '网络问题') + '（玩家端暂时看不到身份）');
    return false;
  }
}

  stopRoomPoll();

async function refreshRoom(){

    + '<span style="font-size:12px;color:var(--muted)">已选 ' + picked + ' / ' + total + ' 个号</span>'
    + '<span style="flex:1"></span>'
    + '<button class="btn btn-sm" id="rmRef">刷新</button></div>'
    + '<div class="rm-bar"><button class="btn btn-primary" id="rmPush">同步当前身份到玩家手机</button>'

    + '<button class="btn btn-sm btn-danger" id="rmDrop">解散房间</button></div>'
    + '<div class="rm-seats">' + cells + '</div>'
    + '<div class="rm-note">链接发到群里，每人点进来选自己的号。<br>'
    + (locked
        ? '已锁定：身份已同步，玩家打开链接就能看到自己的牌。要重来请点「解锁重选」。'
        : '都选完之后，点「设置 → 随机发牌并开始」，身份会自动按座位同步。也可以现在就点上面的按钮把当前身份推上去。')
    + '</div>';

  const cp = el.querySelector('#rmCopy');
    if(cp) cp.addEventListener('click', ()=>{ fallbackCopy(link); toast('链接已复制，去群里粘贴'); });
  const rf = el.querySelector('#rmRef');
    if(rf) rf.addEventListener('click', ()=>{ refreshRoom(); toast('已刷新'); });

  const un = el.querySelector('#rmUnlock');

    if(dp) dp.addEventListener('click', ()=>{
      if(!confirm('解散房间？玩家手里的链接会失效。')) return;

    });

async function doCreateRoom(){
  const b = document.getElementById('rmCreate');
  if(b){ b.disabled = true; b.textContent = '创建中…'; }
  const total = (state && state.players && state.players.length) ? state.players.length : 12;
  try{
    const data = { total, seats:{}, ids:{}, locked:false, ts: Date.now() };

    writeRoom({ id, total, createdAt: Date.now() });
    roomCache = data;

    toast('创建失败：' + (e.message || '网络问题') + '，再点一次试试');

}

async function doUnlockRoom(){
  if(!room || !room.id) return;
  if(!confirm('解锁后玩家可以重新选号，已同步的身份会作废。确定吗？')) return;
  try{
    const base = roomCache || await cloudGet(room.id);
    await cloudPut(room.id, Object.assign({}, base, { locked:false, ids:{}, ts: Date.now() }));
    roomCache = null;
    await refreshRoom();
    toast('已解锁，玩家可以重新选号');
  }catch(e){
    toast('解锁失败：' + (e.message || '网络问题'));

const CAMP_LABEL = { wolf:'狼人阵营', god:'神职阵营', vil:'平民阵营' };
const P = { rid:null, data:null, err:'', mySeat:null, busy:false, name:'', revealed:false, timer:null };

function plEl(){ return document.getElementById('plWrap'); }

function plToast(msg){
  let t = document.getElementById('plToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'plToast';
    t.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;'
      + 'padding:11px 18px;border-radius:10px;background:rgba(217,88,78,.94);color:#fff;'
      + 'font-size:13px;line-height:1.6;max-width:86vw;text-align:center;'
      + 'box-shadow:0 12px 30px rgba(0,0,0,.55);transition:opacity .25s;font-family:inherit';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.style.opacity = '0'; }, 2400);
}

function startPlayerMode(){
  const rid = hashRoomId();
  if(!rid) return false;
  P.rid = rid;
  document.body.classList.add('player-mode');
  const app = document.querySelector('.app');
  if(app) app.style.display = 'none';
  const root = document.getElementById('playerRoot');
  if(root) root.style.display = 'flex';
  try{ P.mySeat = parseInt(localStorage.getItem(SEAT_LS + rid) || '', 10) || null; }catch(e){ P.mySeat = null; }
  pPaint();
  pPull().then(pPaint);
  pLoop();
  return true;
}

async function pPull(){
  try{
    const d = await cloudGet(P.rid);
    P.data = d;
    P.err = '';
    if(P.mySeat){
      const s = (d.seats || {})[String(P.mySeat)];
      if(s && s.cid && s.cid !== clientId()){
        P.mySeat = null;
        try{ localStorage.removeItem(SEAT_LS + P.rid); }catch(e){}
        plToast('你的号被占用了，请重选一个');
      }
    }
  }catch(e){
    P.err = e.message || '网络异常';
  }
}

function pLoop(){
  if(P.timer) clearInterval(P.timer);
  P.timer = setInterval(async ()=>{
    if(!P.rid) return;
    if(P.data && P.data.locked && P.mySeat) return;
    const ae = document.activeElement;
    if(ae && ae.id === 'plName') return;
    await pPull();
    pPaint();
  }, 7000);
}

function pPaint(){
  const el = plEl();
  if(!el) return;
  const tag = document.getElementById('plSeatTag');
  if(tag){
    if(P.mySeat){ tag.style.display = ''; tag.textContent = '你的号 ' + String(P.mySeat).padStart(2,'0'); }
    else tag.style.display = 'none';
  }

  if(!P.data){
    if(P.err){
      el.innerHTML = '<div class="pl-wait"><div class="pl-big">连不上房间</div>'
        + '<div class="pl-sub">' + esc(P.err) + '<br>检查一下网络，或者再点一次。</div>'
        + '<button class="pl-btn primary" data-repull="1" style="margin-top:24px">重试</button></div>';
    }else{
      el.innerHTML = '<div class="pl-wait"><div class="ring"></div><div class="pl-big">正在进入房间…</div></div>';
    }
  }else if(!P.mySeat){
    el.innerHTML = pickHTML();
  }else if(!P.data.locked){
    el.innerHTML = waitHTML();
  }else{
    el.innerHTML = revealHTML();
  }
  bindPlayerEvents();
}

function pickHTML(){
  const d = P.data;
  const total = Math.max(1, Math.min(40, parseInt(d.total, 10) || 12));
  const seats = d.seats || {};
  let cells = '';
  for(let i=1;i<=total;i++){
    const s = seats[String(i)];
    cells += '<button class="pl-seat ' + (s ? 'taken' : '') + '" data-seat="' + i + '"' + (s ? ' disabled' : '') + '>'
      + i + '<small>' + (s ? '已选' : '可选') + '</small></button>';
  }
  return '<div class="pl-h1">选择你的座位号</div>'
    + '<div class="pl-sub">一个号只能被一个人选。选好后记住自己的号，整局都按这个号行动。</div>'
    + '<div class="pl-label">你的名字（可以留空）</div>'
    + '<input class="pl-input" id="plName" maxlength="12" placeholder="例如 Roy" value="' + esc(P.name) + '">'
    + '<div class="pl-label">座位号 · 共 ' + total + ' 个</div>'
    + '<div class="pl-grid">' + cells + '</div>'
    + '<div class="pl-note">点了就直接占号，别人再点会显示「已选」。点错了可以点下面的按钮换号。</div>';
}

function waitHTML(){
  const seat = String(P.mySeat).padStart(2,'0');
  return '<div class="pl-wait"><div class="ring"></div>'
    + '<div class="pl-big">你是 ' + seat + ' 号</div>'
    + '<div class="pl-sub">占号成功。等上帝统一下发身份后，这里会自动出现你的牌面。</div>'
    + '</div>'
    + '<div class="pl-note">页面会每 7 秒自己检查一次，不用手动刷新。</div>'
    + '<button class="pl-btn ghost" data-repull="1">立即检查</button>'
    + '<button class="pl-btn ghost" id="plChange">换一个号</button>';
}

function revealHTML(){
  const seat = String(P.mySeat).padStart(2,'0');
  const role = (P.data.ids || {})[String(P.mySeat)];
  if(!role || !ROLES[role]){
    return '<div class="pl-wait"><div class="ring"></div>'
      + '<div class="pl-big">你是 ' + seat + ' 号</div>'
      + '<div class="pl-sub">已经锁定了，但身份还没同步上来。稍等几秒，或者让上帝点「在线选号 → 同步当前身份」。</div>'
      + '</div><button class="pl-btn ghost" data-repull="1">重新获取</button>';
  }
  const r = ROLES[role];
  const on = !!P.revealed;
  return '<div class="pl-h1">你的身份</div>'
    + '<div class="pl-sub">只有你自己能看到。看完记得盖回去，别让旁边的人瞄到。</div>'
    + '<div class="pl-card ' + (on ? 'flip' : '') + '" id="plCard">'
    + '<div class="pc-seat">SEAT ' + seat + '</div>'
    + (on
        ? '<div class="pc-role" style="color:' + ROLE_COLOR[role] + '">' + r.name + '</div>'
          + '<div class="pc-camp">' + (CAMP_LABEL[r.camp] || '') + '</div>'
          + '<div class="pc-brief">' + esc(r.brief || '') + '</div>'
        : '<div class="pc-q">?</div><div class="pc-txt">点击翻开</div>')
    + '</div>'
    + '<div class="pl-tip">' + (on ? '再点一下卡片可以盖回去。' : '确认左右没人偷看，再翻开。') + '</div>'
    + '<button class="pl-btn ghost" data-repull="1">刷新身份</button>';
}

function bindPlayerEvents(){
  const el = plEl();
  if(!el) return;
  el.querySelectorAll('[data-seat]').forEach(b=>{
    b.addEventListener('click', ()=>pTake(parseInt(b.dataset.seat, 10)));
  });
  const nm = el.querySelector('#plName');
  if(nm) nm.addEventListener('input', ()=>{ P.name = nm.value; });
  const ch = el.querySelector('#plChange');
  if(ch) ch.addEventListener('click', pRelease);
  const card = el.querySelector('#plCard');
  if(card) card.addEventListener('click', ()=>{ P.revealed = !P.revealed; pPaint(); });
  el.querySelectorAll('[data-repull]').forEach(b=>{
    b.addEventListener('click', ()=>{ pPull().then(pPaint); });
  });
}

async function pTake(seat){
  if(P.busy || !seat) return;
  P.busy = true;
  const nmEl = document.getElementById('plName');
  const nm = ((nmEl && nmEl.value) || P.name || '').trim().slice(0, 12);
  try{
    const d = await cloudGet(P.rid);
    if(d.locked){ P.data = d; plToast('已经锁定发牌了，不能再选号'); return; }
    const seats = d.seats || {};
    if(seats[String(seat)]){ P.data = d; plToast('慢了一步，这个号刚被选走'); return; }
    seats[String(seat)] = { n: nm || (seat + '号'), cid: clientId(), t: Date.now() };
    await cloudPut(P.rid, Object.assign({}, d, { seats, ts: Date.now() }));
    P.mySeat = seat;
    P.name = nm;
    P.data = Object.assign({}, d, { seats });
    try{ localStorage.setItem(SEAT_LS + P.rid, String(seat)); }catch(e){}
  }catch(e){
    plToast('选号失败：' + (e.message || '网络问题') + '，再点一次试试');
  }finally{
    P.busy = false;
    pPaint();
  }
}

async function pRelease(){
  if(!P.mySeat) return;
  if(!confirm('放弃 ' + P.mySeat + ' 号，重新选一个？')) return;
  try{
    const d = await cloudGet(P.rid);
    if(d.locked){ plToast('已经开始发牌，不能换号了'); return; }
    const seats = d.seats || {};
    const mine = seats[String(P.mySeat)];
    if(mine && mine.cid === clientId()){
      delete seats[String(P.mySeat)];
      await cloudPut(P.rid, Object.assign({}, d, { seats, ts: Date.now() }));
    }
    P.mySeat = null;
    P.data = Object.assign({}, d, { seats });
    try{ localStorage.removeItem(SEAT_LS + P.rid); }catch(e){}
    pPaint();
  }catch(e){
    plToast('换号失败：' + (e.message || '网络问题'));
  }
}

function boot(){
  if(hashRoomId()){ startPlayerMode(); return; }
  const saved = load();
  if(saved && saved.players && saved.players.length){
    state = saved;
    if(!state.undos) state.undos = [];
    if(!state.night) state.night = {kill:null,save:false,poison:null,guard:null,guardPrev:null,seer:null,
                                    charm:null,copy:null,medium:null};
    ['charm','copy','medium'].forEach(k=>{ if(state.night[k] === undefined) state.night[k] = null; });
    if(state.night.custom === undefined) state.night.custom = {};
    if(!state.witch) state.witch = {saveUsed:false, poisonUsed:false};
    if(!state.votes) state.votes = {};
    if(!state.logs) state.logs = [];
    if(!state.revealed) state.revealed = {};
    if(state.boomUsed === undefined) state.boomUsed = false;
    if(state.duelUsed === undefined) state.duelUsed = false;
    if(!state.shotQueue) state.shotQueue = [];
    if(state.pendingShot && typeof state.pendingShot === 'number'){
      state.pendingShot = {seat: state.pendingShot, type: 'hunter'};
    }
    // 恢复自定义身份定义与板子信息（重新加载后全局角色表是空的）
    if(state.customCfg && state.customCfg.extra) registerCustomRoles(state.customCfg.extra);
    if(!state.config && state.customCfg && state.customCfg.extra) registerCustomRoles(state.customCfg.extra);
    if(!state.boardName) state.boardName = (BOARDS[state.boardKey] || {}).name || '对局';
    if(!state.config){
      const wolfs = state.players.map(p=>p.role).filter(r=>ROLES[r] && ROLES[r].camp==='wolf');
      const godz = state.players.map(p=>p.role).filter(r=>ROLES[r] && ROLES[r].camp==='god');
      state.config = {
        key: state.boardKey || 'custom',
        name: state.boardName || '对局',
        total: state.players.length,
        wolves: wolfs,
        gods: godz,
        extra: (state.customCfg && state.customCfg.extra) || []
      };
    }
    if(!state.census){
      const census = {wolf:0, god:0, vil:0};
      state.players.forEach(p=>{
        const camp = (ROLES[p.role] && ROLES[p.role].camp) || 'vil';
        census[camp === 'wolf' ? 'wolf' : (camp === 'god' ? 'god' : 'vil')] += 1;
      });
      state.census = census;
    }
    document.getElementById('actionZone').innerHTML = '';
    renderAll();
    tReset(state.speakSeconds || 90);
    setTimeout(()=>toast('已恢复上次对局：第 ' + state.day + (state.phase==='night'?'夜':'天')), 600);
  }else{
    state = createState('std12', null);
    state.started = false;
    openSetup(true);
  }
  bindEvents();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

})();
</script>
