    const deaths = state.dawnResolved ? [] : computeDeaths();
    if(state.dawnResolved){
      html += '<div class="action-box"><div class="hint-ok">昨夜出局名单已宣布并标记。点「进入白天」继续。</div></div>';
    }else if(!deaths.length){
      html += '<div class="action-box"><div class="action-label">昨夜结果</div>'
        + '<div class="hint-ok">平安夜，没有人出局。</div>'
        + '<div class="btn-row"><button class="btn" data-act="dawn-confirm">宣布平安夜</button></div></div>';
    }else{
      html += '<div class="action-box"><div class="action-label">昨夜出局（' + deaths.length + ' 人）</div>'
        + deaths.map(d=>chip(d.seat, d.cause)).join('')
        + '<div class="btn-row"><button class="btn btn-danger" data-act="dawn-confirm">宣布出局并标记</button></div></div>';
    }
  }

  if(st.key === 'debate'){
    html += '<div class="action-box"><div class="action-label">发言节奏</div>'
      + (state.speakPointer
          ? chip(state.speakPointer)
          : empty('点右栏「下一位发言」开始'))
      + '<div class="tip">发言阶段可用计时器控制时长，到点响铃。注意记录每个人的表态。</div></div>';

    if(aliveRole('whiteWolf') && !state.boomUsed){
      html += '<div class="action-box"><div class="action-label">白狼王自爆</div>'
        + '<div class="tip">白狼王可在白天跳出来自爆：立即终止今天的投票、直接进入黑夜，并可带走一名玩家。</div>'
        + (state.shotTarget ? chip(state.shotTarget) : empty('点击座位选择要带走的人'))
        + '<div class="btn-row"><button class="btn btn-danger" data-act="boom-confirm" '+(state.shotTarget?'':'disabled')+'>确认自爆并带走</button></div></div>';
    }
  }

  if(st.key === 'vote'){
    const list = Object.entries(state.votes).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    html += '<div class="action-box"><div class="action-label">计票（点击座位 +1）</div>';
    if(!list.length){
      html += empty('还没有票，点击座位开始记录');
    }else{
      html += list.map(([k,v])=>chip(+k, null, v + ' 票')).join('');
    }
    html += '<div class="btn-row"><button class="btn" data-act="vote-clear">清空票数</button>'
      + '<button class="btn btn-primary" data-act="vote-exile">确认放逐</button></div></div>';
  }

  if(st.key === 'exile'){
    const list = Object.entries(state.votes).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const max = list.length ? list[0][1] : 0;
    const top = list.filter(([k,v])=>v===max);
    html += '<div class="action-box"><div class="action-label">放逐结果</div>';
    if(!list.length){
      html += empty('本局没有记录票数');
    }else if(top.length > 1){
      html += '<div class="hint-warn">平票：' + top.map(([k,v])=>fmtSeat(+k)+'号('+v+')').join('、') + '。请 PK 发言后重投，或手动点座位标记出局。</div>';
    }else{
      html += chip(+top[0][0], 'vote', max + ' 票');
      html += '<div class="tip">' + (state.exileResolved ? '已放逐。请让其发表遗言。' : '确认后将标记为出局。') + '</div>';
    }
    if(!state.exileResolved && top.length === 1){
      html += '<div class="btn-row"><button class="btn btn-danger" data-act="exile-confirm">确认放逐</button></div>';
    }else if(state.exileResolved){
      html += '<div class="hint-ok">已放逐，等待遗言后进入夜晚。</div>';
    }
    html += '</div>';
  }

  return html;
}

function box(label, inner, extra, foot){
  return '<div class="action-box"><div class="action-label">'+label+'</div>'+inner+(extra||'')+(foot||'')+'</div>';
}
function chip(seat, cause, tail){
  const p = getP(seat);
  if(!p) return '';
  return '<div class="chip-target"><span class="n">'+fmtSeat(seat)+'</span>'
    + '<span>'+esc(p.name)+'</span>'
    + '<span style="margin-left:auto;font-size:11.5px;color:var(--muted)">'
    + (cause ? CAUSE_LABEL[cause] : (tail || ROLES[p.role].name)) + '</span></div>';
}
function empty(txt){ return '<div class="chip-empty">'+txt+'</div>'; }

/* ---------- 步骤条 ---------- */
function renderSteps(){
  const list = steps();
  const cur = state.stepKey;
  const curIdx = stepIndex();
  document.getElementById('stepsTitle').textContent = state.phase==='night' ? '夜晚流程' : '白天流程';
  document.getElementById('stepsProgress').textContent = (curIdx+1) + ' / ' + list.length;
  const el = document.getElementById('stepList');
  el.innerHTML = list.map((s,i)=>{
    let cls = 'step';
    if(i < curIdx) cls += ' done';
    if(s.key === cur) cls += ' active';
    return '<div class="'+cls+'" data-step="'+s.key+'">'
      + '<span class="idx">'+(i < curIdx ? '✓' : (i+1))+'</span>'
      + '<span>'+s.title+'</span>'
      + '<span class="meta">'+(stepMeta(s))+'</span></div>';
  }).join('');
}

function stepMeta(s){
  const n = state.night;
  if(s.key === 'nightfall') return '闭眼';
  if(s.key === 'dawn') return state.dawnResolved ? '已宣布' : '待宣布';
  if(s.key === 'debate') return state.speakPointer ? fmtSeat(state.speakPointer) : '—';
  if(s.key === 'vote') return Object.values(state.votes).reduce((a,b)=>a+b,0) + ' 票';
  if(s.key === 'exile') return state.exileResolved ? '已放逐' : '—';
  if(s.key === 'knight') return state.duelUsed ? '已用过' : (state.shotTarget ? fmtSeat(state.shotTarget) : '—');
  if(s.role === 'guard') return n.guard ? fmtSeat(n.guard) : '—';
  if(s.role === 'wolf') return n.kill ? fmtSeat(n.kill) : (n.charm ? '魅' + fmtSeat(n.charm) : '—');
  if(s.role === 'witch') return n.save ? '解药' : (n.poison ? '毒 ' + fmtSeat(n.poison) : '—');
  if(s.role === 'seer') return n.seer ? fmtSeat(n.seer) : '—';
  if(s.wake === 'medium') return n.medium ? fmtSeat(n.medium) : '—';
  if(s.wake === 'pick') return (n.custom && n.custom[s.role]) ? fmtSeat(n.custom[s.role]) : '—';
  if(s.role === 'hunter') return '—';
  return '';
}

/* ---------- 座位板 ---------- */
function renderBoard(){
  const el = document.getElementById('board');
  const alive = aliveGhost().length;
  document.getElementById('aliveCount').textContent = alive + ' / ' + state.players.length + ' 人存活';

  const inVote = state.stepKey === 'vote' || state.stepKey === 'exile';
  let maxVote = 0;
  if(inVote){
    const vs = Object.values(state.votes);
    maxVote = vs.length ? Math.max(...vs) : 0;
  }

  el.innerHTML = state.players.map(p=>{
    const r = ROLES[p.role];
    const hidden = state.identityHidden && !state.revealed[p.seat];
    let cls = 'seat';
    if(!p.alive) cls += ' dead';
    if(isTargetSeat(p.seat)) cls += (state.pickMode==='shot' && state.shotTarget===p.seat) ? ' shot-target' : ' target';

    let stateTxt = '存活';
    let pip = true;
    if(!p.alive && p.death){
      stateTxt = '出局 · ' + CAUSE_LABEL[p.death.cause];
      pip = false;
    }
    const seats = [];
    if(!hidden){
      const nightOpen = state.phase === 'night' && state.stepKey !== 'dawn';
      if(p.seat === state.night.guard && nightOpen) seats.push('<span class="tag guarded">守护</span>');
      if(p.tags.includes('novote')) seats.push('<span class="tag voteless">无票权</span>');
      if(p.seat === state.night.poison && nightOpen) seats.push('<span class="tag poisoned">中毒</span>');
    }

    const vc = state.votes[p.seat] || 0;
    const showVote = inVote && vc > 0;

    return '<div class="'+cls+'" data-seat="'+p.seat+'" data-r="'+(hidden?'hidden':p.role)+'">'
      + '<div class="seat-no">'+fmtSeat(p.seat)+'</div>'
      + '<div class="badge'+(hidden?' hidden-id':'')+'">'+(hidden ? '?' : r.badge)+'</div>'
      + '<div class="seat-name">'+esc(p.name)+'</div>'
      + '<div class="seat-role">'+(hidden ? '身份已隐藏' : r.name)+'</div>'
      + '<div class="seat-state">'+(pip?'<span class="pip"></span>':'')+stateTxt+'</div>'
      + (seats.length ? '<div class="tagrow">'+seats.join('')+'</div>' : '')
      + (showVote ? '<div class="votecount'+(vc===maxVote?' top':'')+'">'+vc+'</div>' : '')
      + '<button class="seat-menu" data-menu="'+p.seat+'">⋯</button>'
      + '</div>';
  }).join('');
}

function isTargetSeat(seat){
  const m = state.pickMode;
  const n = state.night;
  if(m === 'kill')   return n.kill === seat;
  if(m === 'poison') return n.poison === seat;
  if(m === 'seer')   return n.seer === seat;
  if(m === 'guard')  return n.guard === seat;
  if(m === 'charm')  return n.charm === seat;
  if(m === 'copy')   return n.copy === seat;
  if(m === 'medium') return n.medium === seat;
  if(m === 'pick'){
    const r = curStep().role;
    return !!(n.custom && n.custom[r] === seat);
  }
  if(m === 'shot' || m === 'duel' || m === 'boom') return state.shotTarget === seat;
  return false;
}

/* ---------- 统计 ---------- */
function renderStats(){
  const alive = aliveGhost();
  document.getElementById('statWolf').textContent = alive.filter(p=>ROLES[p.role].camp==='wolf').length;
  document.getElementById('statGod').textContent = alive.filter(p=>ROLES[p.role].camp==='god').length;
  document.getElementById('statVil').textContent = alive.filter(p=>ROLES[p.role].camp==='vil').length;
}

/* ---------- 座位交互 ---------- */
function onSeatClick(seat){
  const p = getP(seat);
  if(!p) return;

  const pendingActive = state.pendingShot && !((getP(state.pendingShot.seat)||{tags:[]}).tags.includes('shotUsed'));
  if(pendingActive && !state.pickMode){
    state.shotTarget = (state.shotTarget === seat ? null : seat);
    renderAll();
    return;
  }

  switch(state.pickMode){
    case 'kill':
      snap();
      state.night.kill = (state.night.kill === seat ? null : seat);
      if(state.night.kill) log('狼人选择击杀 '+fmtSeat(seat)+' 号 '+p.name);
      renderAll();
      break;
    case 'guard':
      if(state.night.guardPrev === seat){
        toast('守卫不能连续两晚守护同一人');
        return;
      }
      snap();
      state.night.guard = (state.night.guard === seat ? null : seat);
      if(state.night.guard) log('守卫选择守护 '+fmtSeat(seat)+' 号 '+p.name);
      renderAll();
      break;
    case 'charm':
      snap();
      state.night.charm = (state.night.charm === seat ? null : seat);
      state.charmLast = state.night.charm;
      if(state.night.charm) log('狼美人魅惑 '+fmtSeat(seat)+' 号 '+p.name);
      renderAll();
      break;
    case 'copy':
      snap();
      state.night.copy = (state.night.copy === seat ? null : seat);
      if(state.night.copy) log('机械狼复制目标：'+fmtSeat(seat)+' 号 '+p.name+'（'+ROLES[p.role].name+'）');
      renderAll();
      break;
    case 'medium':
      snap();
      state.night.medium = (state.night.medium === seat ? null : seat);
      if(state.night.medium){
        log('通灵师查验 '+fmtSeat(seat)+' 号 '+p.name+'（'+(p.alive?'存活':'已出局')+'）→ '+ROLES[p.role].name,
            ROLES[p.role].camp==='wolf'?'danger':'ok');
      }
      renderAll();
      break;
    case 'pick': {
      const r = curStep().role;
      snap();
      state.night.custom = state.night.custom || {};
      state.night.custom[r] = (state.night.custom[r] === seat ? null : seat);
      if(state.night.custom[r]) log(ROLES[r].name+' 指定 '+fmtSeat(seat)+' 号 '+p.name);
      renderAll();
      break;
    }
    case 'duel':
    case 'boom':
    case 'shot':
      if(!p.alive){ toast('该玩家已出局'); return; }
      state.shotTarget = (state.shotTarget === seat ? null : seat);
      renderAll();
      break;
    case 'seer':
      snap();
      state.night.seer = seat;
      log('预言家查验 '+fmtSeat(seat)+' 号 '+p.name+' → '+(ROLES[p.role].camp==='wolf'?'狼人':'好人'), ROLES[p.role].camp==='wolf'?'danger':'ok');
      beep(660, .12, .2);
      renderAll();
      break;
    case 'poison':
      snap();
      state.night.poison = (state.night.poison === seat ? null : seat);
      state.night.save = false;
      state.witch.poisonUsed = !!state.night.poison;
      if(state.night.poison) log('女巫使用毒药，目标 '+fmtSeat(seat)+' 号 '+p.name, 'danger');
      renderAll();
      break;
    case 'vote':
      state.votes[seat] = (state.votes[seat] || 0) + 1;
      beep(520, .06, .12);
      renderAll();
      break;
    case 'speak':
      state.speakPointer = seat;
      renderAll();
      break;
    default:
      openSeatMenu(seat);
  }
}

function decVote(seat){
  if(!state.votes[seat]) return;
  state.votes[seat] -= 1;
  if(state.votes[seat] <= 0) delete state.votes[seat];
  renderAll();
}

/* ---------- 座位菜单 ---------- */
let ctxSeat = null;
function openSeatMenu(seat){
  const p = getP(seat);
  const r = ROLES[p.role];
  const root = document.getElementById('ctxRoot');
  root.innerHTML = '<div class="ctx-menu">'
    + '<div class="cm-head">'+fmtSeat(seat)+' 号 · '+esc(p.name)+' · '+r.name+'</div>'
    + '<div class="cm-sub">出局原因</div>'
    + '<div class="cm-roles">'
    + '<button data-cm="dead" data-cause="wolf">狼人击杀</button>'
    + '<button data-cm="dead" data-cause="poison">女巫毒杀</button>'
    + '<button data-cm="dead" data-cause="vote">投票放逐</button>'
    + '<button data-cm="dead" data-cause="shot">猎人枪杀</button>'
    + '</div>'
    + '<div class="cm-sep"></div>'
    + '<button data-cm="revive">复活（恢复存活）</button>'
    + '<button data-cm="novote">切换「无票权」标记</button>'
    + '<div class="cm-sep"></div>'
    + '<div class="cm-sub">变更身份</div>'
    + '<div class="cm-roles">'
    + Object.keys(ROLES).map(k=>'<button data-cm="role" data-role="'+k+'">'+ROLES[k].name+'</button>').join('')
    + '</div>'
    + '</div>';

  const menuEl = root.querySelector('.ctx-menu');
  const box = document.getElementById('board').getBoundingClientRect();
  // 定位到座位卡片附近
  const seatEl = document.querySelector('.seat[data-seat="'+seat+'"]');
  let x = 200, y = 200;
  if(seatEl){
    const r2 = seatEl.getBoundingClientRect();
    x = Math.min(r2.right + 8, window.innerWidth - 200);
    y = Math.min(r2.top, window.innerHeight - 380);
    if(x < 8) x = 8;
    if(y < 8) y = 8;
  }
  menuEl.style.left = x + 'px';
  menuEl.style.top = y + 'px';

  ctxSeat = seat;
  setTimeout(()=>{ document.addEventListener('click', closeCtx, {once:true}); }, 0);
}
function closeCtx(){ document.getElementById('ctxRoot').innerHTML = ''; ctxSeat = null; }

function onCtxAction(btn){
  const p = getP(ctxSeat);
  if(!p) return;
  const cm = btn.dataset.cm;
  if(cm === 'dead'){
    snap();
    killSeat(ctxSeat, btn.dataset.cause || 'other');
  }else if(cm === 'revive'){
    snap();
    p.alive = true; p.death = null;
    p.tags = p.tags.filter(t=>t!=='novote');
    log(fmtSeat(ctxSeat)+' 号复活（手动修正）', 'sys');
    renderAll();
  }else if(cm === 'novote'){
    snap();
    const has = p.tags.includes('novote');
    p.tags = has ? p.tags.filter(t=>t!=='novote') : p.tags.concat('novote');
    renderAll();
  }else if(cm === 'role'){
    snap();
    const old = ROLES[p.role].name;
    p.role = btn.dataset.role;
    log(fmtSeat(ctxSeat)+' 号身份由「'+old+'」改为「'+ROLES[p.role].name+'」（手动修正）', 'sys');
    renderAll();
  }
  closeCtx();
}

/* ---------- 操作指令 ---------- */
function handleAction(act){
  switch(act){
    case 'kill-clear':
      snap(); state.night.kill = null; log('狼人选择空刀（本夜无人被刀）'); renderAll();
      break;
    case 'guard-clear':
      snap(); state.night.guard = null; renderAll();
      break;
    case 'witch-save': {
      if(!state.night.kill || state.witch.saveUsed) return;
      snap();
      state.night.save = true;
      state.night.poison = null;
      state.witch.saveUsed = true;
      state.pickMode = null;
      log('女巫对 '+fmtSeat(state.night.kill)+' 号使用解药，本夜其不会出局', 'ok');
      renderAll();
      toast('已使用解药');
      break;
    }
    case 'witch-poison':
      if(state.witch.poisonUsed) return;
      state.pickMode = 'poison';
      renderAll();
      toast('请点击座位选择毒药目标');
      break;
    case 'witch-none':
      snap();
      state.night.save = false; state.night.poison = null; state.pickMode = null;
      log('女巫本夜未使用药水');
      renderAll();
      break;
    case 'seer-clear':
      snap(); state.night.seer = null; renderAll();
      break;
    case 'dawn-confirm':
      resolveDawn();
      break;
    case 'vote-clear':
      snap(); state.votes = {}; renderAll();
      break;
    case 'vote-exile':
      if(!Object.keys(state.votes).length){ toast('还没有记录任何票数'); return; }
      snap();
      state.stepKey = 'exile'; state.pickMode = null;
      doExile();
      renderAll();
      break;
    case 'exile-confirm':
      snap(); doExile(); renderAll();
      break;
    case 'charm-pick':
      state.pickMode = 'charm'; state.shotTarget = null; renderAll();
      toast('请点击座位指定魅惑对象');
      break;
    case 'charm-clear':
      snap(); state.night.charm = null; state.charmLast = null; renderAll();
      break;
    case 'copy-pick':
      state.pickMode = 'copy'; state.shotTarget = null; renderAll();
      toast('请点击座位指定复制对象');
      break;
    case 'copy-clear':
      snap(); state.night.copy = null; renderAll();
      break;
    case 'medium-clear':
      snap(); state.night.medium = null; renderAll();
      break;
    case 'custom-pick':
      state.pickMode = 'pick'; state.shotTarget = null; renderAll();
      break;
    case 'custom-clear': {
      const r = curStep().role;
      snap();
      if(state.night.custom) state.night.custom[r] = null;
      renderAll();
      break;
    }
    case 'duel-confirm': {
      if(!state.shotTarget) return;
      const kn = state.players.find(p=>p.role==='knight' && p.alive);
      if(!kn || state.duelUsed) return;
      const tSeat = state.shotTarget;
      const t = getP(tSeat);
      snap();
      state.duelUsed = true;
      state.shotTarget = null;
      if(ROLES[t.role].camp === 'wolf'){
        log('骑士 '+fmtSeat(kn.seat)+' 号决斗 '+fmtSeat(tSeat)+' 号，对方是狼人，狼人当场出局', 'danger');
        killSeat(tSeat, 'duel');
      }else{
        log('骑士 '+fmtSeat(kn.seat)+' 号决斗 '+fmtSeat(tSeat)+' 号，对方不是狼人，骑士出局', 'danger');
        killSeat(kn.seat, 'duel');
      }
      renderAll();
      break;
    }
    case 'boom-confirm': {
      const bw = state.players.find(p=>p.role==='whiteWolf' && p.alive);
      if(!bw || state.boomUsed || !state.shotTarget) return;
      const tSeat = state.shotTarget;
      snap();
      state.boomUsed = true;
      state.shotTarget = null;
      log('白狼王 '+fmtSeat(bw.seat)+' 号自爆，带走 '+fmtSeat(tSeat)+' 号 '+getP(tSeat).name, 'danger');
      killSeat(bw.seat, 'boom');
      killSeat(tSeat, 'boom');
      toast('白狼王自爆，直接进入黑夜');
      state.votes = {};
      startNewNight();
      break;
    }
    case 'shot-confirm': {
      if(!state.shotTarget || !state.pendingShot) return;
      const hSeat = state.pendingShot.seat;
      const type = state.pendingShot.type;
      const h = getP(hSeat);
      const target = state.shotTarget;
      snap();
      if(h) h.tags.push('shotUsed');
      const tag = shotHolderText(type);
      state.shotTarget = null;
      nextShot();
      log(tag+' '+fmtSeat(hSeat)+' 号带走 '+fmtSeat(target)+' 号 '+getP(target).name, 'danger');
      killSeat(target, 'pierce');
      renderAll();
      break;
    }
    case 'shot-cancel': {
      if(!state.pendingShot) return;
      const h = getP(state.pendingShot.seat);
      const tag = shotHolderText(state.pendingShot.type);
      snap();
      if(h) h.tags.push('shotUsed');
      nextShot();
      log(tag+' 放弃带走');
      renderAll();
      break;
    }
    case 'exit-screen':
      state.screenMode = false; renderScreen(); save();
      break;
  }
}

/* ---------- 大屏模式 ---------- */
function renderScreen(){
  const root = document.getElementById('screenRoot');
  if(!state || !state.screenMode){ root.innerHTML = ''; return; }
  const st = curStep();
  const isNight = state.phase === 'night';
  const subline = state.win ? ''
    : (isNight ? '请保持安静 · 不要睁眼 · 不要出声' : '存活 ' + aliveGhost().length + ' 人');
  root.innerHTML = '<div class="screen'+(isNight?'':' day')+'">'
    + '<div class="moon-orb"></div>'
    + '<div class="phase-top">'+(isNight?'N I G H T':'D A Y')+'</div>'
    + '<div class="big-day">第 ' + state.day + (isNight?' 夜':' 天') + '</div>'
    + '<div class="line">' + (state.win ? state.win.text : st.screen) + '</div>'
    + (subline ? '<div class="subline">'+subline+'</div>' : '')
    + (state.win ? '<div class="win-banner">本局结束 · 请上帝公布复盘</div>' : '')
    + ((T.running || T.left < T.total) ? '<div class="screen-timer" id="scTimer">' + fmtTime(Math.ceil(T.left)) + '</div>' : '')
    + '<button class="exit" data-act="exit-screen">退出大屏</button>'
    + '</div>';
  paintTimer();
}

/* ---------- 计时器 ---------- */
const T = {total:90, left:90, running:false, iv:null, lastSec:null};

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function paintTimer(){
  const txt = fmtTime(Math.ceil(T.left));
  const warn = T.left <= 10 && T.left > 0;
  const d = document.getElementById('timerDigits');
  if(d){
    d.textContent = txt;
    d.className = 'timer-digits' + (warn ? ' warn' : '') + (T.left <= 0 ? ' done' : '');
  }
  const sc = document.getElementById('scTimer');
  if(sc){
    sc.textContent = txt;
    sc.className = 'screen-timer' + (warn ? ' warn' : '');
  }
  const lab = document.getElementById('timerLabel');
  if(lab){
    lab.textContent = T.running ? '计时中' : (T.left <= 0 ? '已结束' : (T.left < T.total ? '已暂停' : '待开始'));
  }
  const tg = document.getElementById('btnTimerToggle');
  if(tg) tg.textContent = T.running ? '暂停' : '开始';
  document.querySelectorAll('#timerPresets .btn').forEach(b=>{
    b.classList.toggle('on', +b.dataset.sec === T.total);
  });
}
function tStart(){
  if(T.left <= 0) T.left = T.total;
  T.running = true;
  T.lastSec = Math.ceil(T.left);
  clearInterval(T.iv);
  T.iv = setInterval(()=>{
    T.left -= 0.2;
    const s = Math.ceil(T.left);
    if(s !== T.lastSec){
      T.lastSec = s;
      if(s <= 10 && s > 0) beep(1180, .05, .12, 'square');
    }
    if(T.left <= 0){
      T.left = 0;
      tStop();
      bell();
    }
    paintTimer();
  }, 200);
  paintTimer();
}
function tStop(){
  T.running = false;
  clearInterval(T.iv);
  T.iv = null;
  paintTimer();
}
function tReset(sec){
  tStop();
  if(sec) T.total = sec;
  T.left = T.total;
  paintTimer();
}

/* ---------- 音效 ---------- */
let actx = null;
function ac(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, vol, type){
  const c = ac(); if(!c) return;
  try{
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(vol || .2, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + (dur || .15));
    o.start(); o.stop(c.currentTime + (dur || .15));
  }catch(e){}
}
function bell(){
  beep(1046, .5, .3, 'sine');
  setTimeout(()=>beep(784, .6, .28, 'sine'), 150);
  setTimeout(()=>beep(523, .9, .25, 'sine'), 330);
}
function soundWin(){
  [523, 659, 784, 1046].forEach((f,i)=>setTimeout(()=>beep(f, .45, .25, 'triangle'), i*130));
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ if(el.parentNode) el.remove(); }, 2400);
}

        + '<div class="bn">'+BOARDS[k].name+'</div>'
        + '<div class="bd">'+cfgDesc({total:BOARDS[k].total, wolves:BOARDS[k].wolves, gods:BOARDS[k].gods})+'</div></div>').join('')
    + '</div>';

  const body = '<div class="field"><label>快速预设（点一下即可套用）</label>'+presetBar+'</div>'

    + '<div class="field"><label>人数与阵营配比</label>'
    + '<div class="cfg-top"><span>总人数</span><input type="number" id="cTotal" min="4" max="30" value="'+cfg.total+'">'
    + '<span>狼人</span><input type="number" id="cWolfN" min="1" max="15" value="'+cfg.wolfTotal+'">'
    + '<button class="btn btn-sm" id="cAuto">按人数自动配置</button></div>'
    + '<div class="cfg-sub">狼人阵营 <b id="cWn">'+cfg.wolfTotal+'</b> 人　点击切换特殊狼，其余自动用普通狼补足</div>'
    + '<div class="role-chips" id="wolfChips">'+wolfChipsHTML()+'</div>'
    + '<div class="cfg-sub">神职阵营 <b id="cGn">'+cfg.gods.length+'</b> 人</div>'
    + '<div class="role-chips" id="godChips">'+godChipsHTML()+'</div>'
    + '<div class="hint" id="cHint"></div></div>'

    + '<div class="field"><label>自定义身份（可选，会拥有独立的夜间环节）</label>'
    + '<div id="extraBox">'+extraHTML()+'</div>'
    + '<button class="btn btn-sm" id="cAddExtra" style="margin-top:9px">+ 新增自定义身份</button></div>'

    + '<div class="field"><label>玩家名单（按座位顺序，每行一个；留空则自动命名为「N号位」）</label>'
    + '<textarea id="nameInput" rows="7" placeholder="1号位&#10;2号位&#10;...">'+esc(defaultNames)+'</textarea>'
    + '<div class="hint" id="nameHint">座位 1 在最前面。当前名单 '+cfg.total+' 人。</div></div>'

    + '<div class="field"><label>胜负判定</label><div class="seg" id="modeSeg">'
    + '<button data-mode="side" class="'+((cur && cur.mode==='all')?'':'on')+'">屠边（杀光神或民即狼胜）</button>'
    + '<button data-mode="all" class="'+((cur && cur.mode==='all')?'on':'')+'">屠城（杀光好人才狼胜）</button>'
    + '</div></div>'

    + '<div class="field"><label>默认发言时长（秒）</label>'
    + '<input type="number" id="speakInput" value="'+((cur && cur.speakSeconds)||90)+'" min="15" max="600"></div>';

  const foot = (mustStart ? '' : '<button class="btn" id="mCancel">取消</button>')
    + '<button class="btn btn-primary" id="mStart">随机发牌并开始</button>';

  const html = '<div class="modal-head"><h3>开局设置</h3><div class="spacer"></div>'
    + (mustStart?'':'<button class="btn btn-sm" id="mClose">关闭</button>')+'</div>'
    + '<div class="modal-body">'+body+'</div>'
    + '<div class="modal-foot">'+foot+'</div>';

  const root = modal(html, 780);

  let mode = (cur && cur.mode === 'all') ? 'all' : 'side';
  const nameInput = root.querySelector('#nameInput');
  const nameHintEl = root.querySelector('#nameHint');

  // 已建在线房间时，优先用玩家自己选号填的名字
  if(room && room.id){
    const initVal = nameInput.value;
    cloudGet(room.id).then(d=>{
      roomCache = d;
      const lines = seatNames(d, cfg.total);
      if(nameInput.value === initVal && lines.some(x=>!/^\d+号位$/.test(x))){
        nameInput.value = lines.join('\n');
        if(nameHintEl) nameHintEl.textContent = '已从「在线选号」读取名单（' + cfg.total + ' 个号位），可以直接改。';
      }
    }).catch(()=>{});
  }
  const hintEl = root.querySelector('#cHint');

  function sync(){
    root.querySelector('#cWn').textContent = cfg.wolfTotal;
    root.querySelector('#cGn').textContent = cfg.gods.length;
    const normal = cfg.wolfTotal - cfg.wolves.length;
    const vil = cfg.total - cfg.wolfTotal - cfg.gods.length;
    const errs = [];
    if(normal < 0) errs.push('特殊狼勾了 '+cfg.wolves.length+' 个，超过狼位 '+cfg.wolfTotal+'，请减少特殊狼或调大狼人数量');
    if(vil < 0) errs.push('狼 '+cfg.wolfTotal+' + 神 '+cfg.gods.length+' 已超过总人数 '+cfg.total);
    if(errs.length){
      hintEl.style.color = '#f0938b';
      hintEl.textContent = errs.join('；');
      return;
    }
    hintEl.style.color = '';
    const wtxt = cfg.wolves.length
      ? cfg.wolves.map(k=>ROLES[k].name).join(' / ') + ' + ' + normal + ' 普通狼'
      : cfg.wolfTotal + ' 普通狼';
    const gtxt = cfg.gods.length ? cfg.gods.map(k=>ROLES[k].name).join(' / ') : '无神职';
    hintEl.textContent = '共 '+cfg.total+' 人 ＝ '+cfg.wolfTotal+' 狼（'+wtxt+'）· '+cfg.gods.length+' 神（'+gtxt+'）· '+vil+' 民';
  }

  function resizeNames(target){
    const lines = nameInput.value.split('\n').map(s=>s.trim()).filter(s=>s !== '');
    const out = [];
    for(let i=0;i<target;i++) out.push(lines[i] || (i+1)+'号位');
    nameInput.value = out.join('\n');
    nameHintEl.textContent = '座位 1 在最前面。当前名单 ' + target + ' 人。';
  }

  function refreshChips(){
    root.querySelector('#wolfChips').innerHTML = wolfChipsHTML();
    root.querySelector('#godChips').innerHTML = godChipsHTML();
  }

  function autoConfig(){
    const t = cfg.total;
    const w = Math.max(2, Math.round(t * 0.3));
    const rest = t - w;
    const g = Math.min(GOD_POOL.length, Math.max(1, Math.floor(rest / 2)));
    cfg.wolfTotal = w;
    cfg.gods = GOD_POOL.slice(0, g);
    root.querySelector('#cWolfN').value = w;
    refreshChips();
    sync();
  }

  sync();

  root.querySelector('#boardOpts').addEventListener('click', e=>{
    const o = e.target.closest('.board-opt');
    if(!o) return;
    const k = o.dataset.board;
    const b = BOARDS[k];
    cfg.key = k;
    cfg.total = b.total;
    cfg.wolfTotal = b.wolves.length;
    cfg.wolves = b.wolves.filter(x=>x!=='wolf');
    cfg.gods = b.gods.slice();
    root.querySelectorAll('.board-opt').forEach(x=>x.classList.toggle('on', x.dataset.board === k));
    root.querySelector('#cTotal').value = cfg.total;
    root.querySelector('#cWolfN').value = cfg.wolfTotal;
    refreshChips();
    sync();
    resizeNames(cfg.total);
  });

  root.querySelector('#cTotal').addEventListener('input', e=>{
    cfg.total = Math.max(4, Math.min(30, +e.target.value || 4));
    cfg.wolfTotal = Math.max(2, Math.round(cfg.total * 0.3));
    root.querySelector('#cWolfN').value = cfg.wolfTotal;
    // 狼位变多后，若神位放不下就自动裁掉末尾的神
    const maxGods = Math.max(0, cfg.total - cfg.wolfTotal);
    if(cfg.gods.length > maxGods) cfg.gods = cfg.gods.slice(0, maxGods);
    if(cfg.wolves.length > cfg.wolfTotal) cfg.wolves = cfg.wolves.slice(0, cfg.wolfTotal);
    refreshChips();
    sync();
    resizeNames(cfg.total);
  });

  root.querySelector('#cWolfN').addEventListener('input', e=>{
    cfg.wolfTotal = Math.max(1, Math.min(15, +e.target.value || 1));
    sync();
  });

  root.querySelector('#cAuto').addEventListener('click', autoConfig);

  root.querySelector('#wolfChips').addEventListener('click', e=>{
    const b = e.target.closest('[data-wk]');
    if(!b) return;
    const k = b.dataset.wk;
    const i = cfg.wolves.indexOf(k);
    if(i >= 0){ cfg.wolves.splice(i,1); b.classList.remove('on'); }
    else {
      if(cfg.wolves.length + 1 > cfg.wolfTotal){ toast('狼位不够：先把狼人数量调大，或取消其他特殊狼'); return; }
      cfg.wolves.push(k); b.classList.add('on');
    }
    sync();
  });

  root.querySelector('#godChips').addEventListener('click', e=>{
    const b = e.target.closest('[data-gk]');
    if(!b) return;
    const k = b.dataset.gk;
    const i = cfg.gods.indexOf(k);
    if(i >= 0){ cfg.gods.splice(i,1); b.classList.remove('on'); }
    else {
      if(cfg.total - cfg.wolfTotal - (cfg.gods.length + 1) < 0){ toast('总人数不够，先调大总人数或减少狼人'); return; }
      cfg.gods.push(k); b.classList.add('on');
    }
    sync();
  });

  const extraBox = root.querySelector('#extraBox');
  function rerenderExtra(){ extraBox.innerHTML = extraHTML(); }

  root.querySelector('#cAddExtra').addEventListener('click', ()=>{
    cfg.extra.push({name:'', camp:'god', count:1, wake:false, order:5.5});
    rerenderExtra();
  });
  extraBox.addEventListener('input', e=>{
    const t = e.target;
    if(t.dataset.xname !== undefined){ cfg.extra[+t.dataset.xname].name = t.value; }
    else if(t.dataset.xcount !== undefined){ cfg.extra[+t.dataset.xcount].count = Math.max(1, Math.min(6, +t.value || 1)); }
  });
  extraBox.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.xcamp !== undefined){ cfg.extra[+t.dataset.xcamp].camp = t.value; }
    if(t.dataset.xwake !== undefined){ cfg.extra[+t.dataset.xwake].wake = t.checked; }
  });
  extraBox.addEventListener('click', e=>{
    const del = e.target.closest('[data-xdel]');
    if(del){ cfg.extra.splice(+del.dataset.xdel, 1); rerenderExtra(); }
  });

  root.querySelector('#modeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button[data-mode]');
    if(!b) return;
    mode = b.dataset.mode;
    root.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on', x.dataset.mode === mode));
  });

  const finish = () => {
    const names = nameInput.value.split('\n').map(s=>s.trim());
    const sec = Math.max(15, Math.min(600, parseInt(root.querySelector('#speakInput').value) || 90));
    const normal = cfg.wolfTotal - cfg.wolves.length;
    const vil = cfg.total - cfg.wolfTotal - cfg.gods.length;
    if(normal < 0){ toast('特殊狼超过狼位，请调整'); return; }
    if(vil < 0){ toast('狼 + 神超过总人数，请调整'); return; }

    const extraArr = cfg.extra
      .filter(x=>(x.name||'').trim() !== '' && (x.count||0) > 0)
      .map((x,i)=>({
        key:'cx'+i,
        name: x.name.trim(),
        badge: x.name.trim().slice(0,1),
        camp: x.camp || 'god',
        count: x.count,
        wake: !!x.wake,
        order: x.order || 5.5
      }));

    const wolvesArr = [];
    for(let i=0;i<normal;i++) wolvesArr.push('wolf');
    cfg.wolves.forEach(k=>wolvesArr.push(k));

    const cfgOut = {
      key: 'custom',
      name: '自定义局（'+cfg.total+' 人）',
      total: cfg.total,
      wolves: wolvesArr,
      gods: cfg.gods.slice(),
      extra: extraArr
    };

    state = createState(cfgOut, names);
    state.mode = mode;
    state.speakSeconds = sec;
    tReset(sec);
    closeModal();
    log('开局：' + state.boardName + '（' + (mode==='side'?'屠边':'屠城') + '），共 ' + state.players.length
      + ' 人 · ' + state.census.wolf + ' 狼 / ' + state.census.god + ' 神职 / ' + state.census.vil + ' 民', 'sys');
    renderAll();
    if(room && room.id) pushIdentities(true);
    else toast('发牌完成，点「发牌台」让每人看自己的身份');
  };

  root.querySelector('#mStart').addEventListener('click', finish);
  const c = root.querySelector('#mCancel') || root.querySelector('#mClose');
  if(c) c.addEventListener('click', closeModal);
}

      + '上帝总览视图：可一次性核对全部身份。<strong>确认身边没有玩家时再打开</strong>，共 '+total+' 人。</div>'
      + '<div class="deal-grid">'+cards+'</div>';
  }

  function render(){
    bodyEl.innerHTML = view === 'single' ? singleHTML() : gridHTML();
    const f = root.querySelector('#dealFoot');
    if(f) f.textContent = view === 'single'
      ? '玩法：把设备递给该玩家，让他自己点开卡片；看完盖上再传给下一位。'
      : '注意：网格总览会同时显示全部身份，只适合上帝单独核对。';
    root.querySelectorAll('#dealModeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.dm === view));
    save();
  }

  render();

  root.querySelector('#dealModeSeg').addEventListener('click', e=>{
    const b = e.target.closest('[data-dm]');
    if(!b) return;
    view = b.dataset.dm;
    render();
  });

  bodyEl.addEventListener('click', e=>{
    const flip = e.target.closest('[data-flip]');
    if(flip){
      const p = state.players[idx];
      state.revealed[p.seat] = !state.revealed[p.seat];
      beep(state.revealed[p.seat] ? 720 : 420, .08, .12);
      render();
      return;
    }
    const nav = e.target.closest('[data-dnav]');
    if(nav){
      state.revealed[state.players[idx].seat] = false;   // 看完自动盖上
      const next = idx + (+nav.dataset.dnav);
      if(next >= total){
        toast('全部 ' + total + ' 位玩家已看完牌');
      }else{
        idx = next < 0 ? 0 : next;
      }
      render();
      return;
    }
    const card = e.target.closest('[data-deal]');
    if(card){
      const seat = +card.dataset.deal;
      state.revealed[seat] = !state.revealed[seat];
      beep(state.revealed[seat] ? 720 : 420, .08, .12);
      render();
    }
  });

  root.querySelector('#dClose').addEventListener('click', closeModal);
  root.querySelector('#dDone').addEventListener('click', ()=>{
    state.players.forEach(p=>state.revealed[p.seat] = false);
    closeModal(); renderAll();
    toast('发牌完毕，可以开始第一夜了');
  });
}

function openRules(){
  let idx = 0;
  const build = () => {
    const tabs = RULE_TABS.map((t,i)=>'<button class="rule-tab'+(i===idx?' on':'')+'" data-tab="'+i+'">'+t.name+'</button>').join('');
    return '<div class="modal-head"><h3>规则手册</h3><div class="spacer"></div>'
      + '<button class="btn btn-sm" id="rClose">关闭</button></div>'
      + '<div class="rule-tabs" id="ruleTabs">'+tabs+'</div>'
      + '<div class="modal-body"><div class="rule-content">'+RULE_TABS[idx].html+'</div></div>';
  };
  let root = modal(build(), 820);
  const bind = () => {
    root.querySelector('#ruleTabs').addEventListener('click', e=>{
      const b = e.target.closest('[data-tab]');
      if(!b) return;
      idx = +b.dataset.tab;
      root = modal(build(), 820);
      bind();
    });
    root.querySelector('#rClose').addEventListener('click', closeModal);
  };
  bind();
}

/* ---------- 日志复制 ---------- */
function copyLog(){
  if(!state.logs.length){ toast('还没有日志'); return; }
  const txt = '狼人杀复盘日志 · ' + (state.boardName || '对局') + '\n'
    + state.players.filter(p=>!p.alive).map(p=>'出局：'+fmtSeat(p.seat)+'号 '+p.name+'（'+CAUSE_LABEL[p.death.cause]+'，第'+p.death.day+(p.death.phase==='night'?'夜':'天')+'）').join('\n')
    + '\n----------\n'
    + state.logs.map(l=>'['+l.t+'] '+l.text).join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('日志已复制到剪贴板')).catch(()=>fallbackCopy(txt));
  }else{
    fallbackCopy(txt);
  }
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('日志已复制'); }
  catch(e){ toast('复制失败，请手动选中日志区'); }
  ta.remove();
}

/* ---------- 初始化 ---------- */
function bindEvents(){
  document.getElementById('btnSetup').addEventListener('click', ()=>openSetup(false));
  document.getElementById('btnDeal').addEventListener('click', ()=>{ if(state) openDeal(); });
  document.getElementById('btnRoom').addEventListener('click', openRoom);
  document.getElementById('btnRules').addEventListener('click', openRules);
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnScreen').addEventListener('click', ()=>{
    state.screenMode = !state.screenMode;
    renderScreen(); save();
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    if(confirm('重开会清空当前这局的所有记录，确定吗？')) openSetup(true);
  });
  document.getElementById('btnHideId').addEventListener('click', ()=>{
    state.identityHidden = !state.identityHidden;
    renderAll();
    toast(state.identityHidden ? '已隐藏身份，座位显示为问号' : '已恢复上帝视角');
  });
  document.getElementById('btnMarkAllAlive').addEventListener('click', ()=>{
    if(!confirm('把所有座位恢复为存活状态？')) return;
    snap();
    state.players.forEach(p=>{ p.alive = true; p.death = null; });
    state.pendingShot = null;
    log('手动修正：全员恢复存活', 'sys');
    renderAll();
  });

  document.getElementById('btnNext').addEventListener('click', goNext);
  document.getElementById('btnPrev').addEventListener('click', goPrev);

  document.getElementById('btnNextSpeaker').addEventListener('click', ()=>{
    const alive = state.players.filter(p=>p.alive && !p.tags.includes('novote')).map(p=>p.seat).sort((a,b)=>a-b);
    const all = state.players.filter(p=>p.alive).map(p=>p.seat).sort((a,b)=>a-b);
    const pool = alive.length ? alive : all;
    if(!pool.length) return;
    const cur = state.speakPointer;
    let next = pool[0];
    if(cur !== null && cur !== undefined){
      const after = pool.find(s=>s > cur);
      next = after !== undefined ? after : pool[0];
    }
    state.speakPointer = next;
    tReset();
    tStart();
    renderAll();
  });

  document.getElementById('btnCheckWin').addEventListener('click', ()=>{
    if(state.win){ toast(state.win.text); return; }
    updateWin();
    if(!state.win) toast('按当前存活情况尚未分出胜负');
  });

  document.getElementById('btnSkipNight').addEventListener('click', ()=>{
    snap();
    state.stepKey = 'dawn'; state.pickMode = null;
    renderAll();
  });
  document.getElementById('btnSkipToVote').addEventListener('click', ()=>{
    snap();
    state.phase = 'day'; state.stepKey = 'vote'; state.pickMode = 'vote';
    state.votes = {};
    renderAll();
  });
  document.getElementById('btnGotoNight').addEventListener('click', ()=>{
    if(!confirm('进入下一夜？会重置今晚的行动记录。')) return;
    startNewNight();
  });

  document.getElementById('timerPresets').addEventListener('click', e=>{
    const b = e.target.closest('[data-sec]');
    if(!b) return;
    tReset(+b.dataset.sec);
  });
  document.getElementById('btnTimerToggle').addEventListener('click', ()=>{
    if(T.running) tStop(); else tStart();
  });
  document.getElementById('btnTimerReset').addEventListener('click', ()=>tReset());

  document.getElementById('btnCopyLog').addEventListener('click', copyLog);
  document.getElementById('btnClearLog').addEventListener('click', ()=>{
    if(!confirm('清空所有日志？')) return;
    state.logs = []; renderLog(); save();
  });

  document.getElementById('board').addEventListener('click', e=>{
    const vc = e.target.closest('.votecount');
    if(vc){
      const seatEl = e.target.closest('.seat');
      if(seatEl){ decVote(+seatEl.dataset.seat); return; }
    }
    const mb = e.target.closest('.seat-menu');
    if(mb){
      e.stopPropagation();
      openSeatMenu(+mb.dataset.menu);
      return;
    }
    const seatEl = e.target.closest('.seat');
    if(seatEl) onSeatClick(+seatEl.dataset.seat);
  });

  document.getElementById('stepList').addEventListener('click', e=>{
    const s = e.target.closest('[data-step]');
    if(!s) return;
    setStep(s.dataset.step);
  });

  document.getElementById('ctxRoot').addEventListener('click', e=>{
    const b = e.target.closest('[data-cm]');
    if(b) onCtxAction(b);
  });

  document.addEventListener('click', e=>{
    const act = e.target.closest('[data-act]');
    if(act){ handleAction(act.dataset.act); }
  });

  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      if(document.getElementById('ctxRoot').innerHTML) closeCtx();
      if(state && state.screenMode){ state.screenMode = false; renderScreen(); save(); }
    }
    if((e.ctrlKey || e.metaKey) && e.key === 'z'){ e.preventDefault(); undo(); }
    if(state && state.screenMode) return;
    if(!state) return;
    if(e.key === 'ArrowRight' && !document.querySelector('.modal-mask')){
      if(document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      goNext();
    }
  });
}

/* ==================== 在线选号：云房间 ==================== */

const CLOUD_API = 'https://extendsclass.com/api/json-storage/bin';
const ROOM_LS = 'ww_room_v1';
const SEAT_LS = 'ww_myseat_';
const CID_LS = 'ww_cid';

let room = (function(){
  try{ const v = JSON.parse(localStorage.getItem(ROOM_LS) || 'null'); return (v && v.id) ? v : null; }catch(e){ return null; }
})();
let roomCache = null;
let roomPoll = null;

function writeRoom(r){
  room = r || null;
  try{
    if(room) localStorage.setItem(ROOM_LS, JSON.stringify(room));
    else localStorage.removeItem(ROOM_LS);
  }catch(e){}
}
function clientId(){
  let c = null;
  try{ c = localStorage.getItem(CID_LS); }catch(e){}
  if(!c){
    c = 'c' + Math.random().toString(36).slice(2,9) + Math.random().toString(36).slice(2,5);
    try{ localStorage.setItem(CID_LS, c); }catch(e){}
  }
  return c;
}
async function cloudFetch(url, opt){
  const ac = new AbortController();
  const tm = setTimeout(()=>ac.abort(), 10000);
  try{ return await fetch(url, Object.assign({}, opt, {signal: ac.signal})); }
  finally{ clearTimeout(tm); }
}
function parseLoose(text){
  const s = String(text).trim();
  const start = s.indexOf('{');
  if(start < 0) return null;
  let depth = 0, end = -1;
  for(let i=start;i<s.length;i++){
    if(s[i] === '{') depth++;
    else if(s[i] === '}'){ depth--; if(depth === 0){ end = i; break; } }
  }
  if(end < 0) return null;
  try{ return JSON.parse(s.slice(start, end + 1)); }catch(e){ return null; }
}
async function cloudCreate(data){
  const r = await cloudFetch(CLOUD_API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = parseLoose(await r.text());
  if(!j || !j.id) throw new Error('返回异常');
  return j.id;
}
async function cloudGet(id){
  const r = await cloudFetch(CLOUD_API + '/' + id + '?r=' + Math.random().toString(36).slice(2), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = parseLoose(await r.text());
  if(!j) throw new Error('数据读取失败');
  return (j.data && typeof j.data === 'object') ? j.data : j;
}
async function cloudPut(id, data){
  const r = await cloudFetch(CLOUD_API + '/' + id, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}
function roomLink(id){
  let base = location.href.split('#')[0];
  try{ base = decodeURI(base); }catch(e){}
  return base + '#room=' + id;
}
function seatNames(d, total){
  const seats = (d && d.seats) || {};
  const out = [];
  for(let i=1;i<=total;i++){
    const s = seats[String(i)];
    out.push(s && s.n ? s.n : (i + '号位'));
  }
  return out;
}
function hashRoomId(){
  const m = /room=([A-Za-z0-9_\-]+)/.exec(location.hash || '');
  return m ? m[1] : null;
}

/* ---------- 上帝端：把本局身份推到云端 ---------- */
async function pushIdentities(silent){
  if(!room || !room.id) return false;
  if(!state || !state.players || !state.players.length){ toast('先开局，再同步身份'); return false; }
  const ids = {};
  state.players.forEach(p=>{ ids[p.seat] = p.role; });
  try{
    let base = roomCache;
    if(!base) base = await cloudGet(room.id);
    const seatsSrc = (base && base.seats) || {};
    const seats = {};
    Object.keys(seatsSrc).forEach(k=>{ if(+k >= 1 && +k <= state.players.length) seats[k] = seatsSrc[k]; });
    await cloudPut(room.id, {
      total: state.players.length,
      seats, ids,
      locked: true,
      ts: Date.now()
    });
    roomCache = null;
    toast(silent ? '身份已同步，玩家可以在手机上翻牌了' : '身份已同步到玩家手机');
    return true;
  }catch(e){
    toast('身份同步失败：' + (e.message || '网络问题') + '（玩家端暂时看不到身份）');
    return false;
  }
}

/* ---------- 上帝端：在线选号弹窗 ---------- */
function stopRoomPoll(){
  if(roomPoll){ clearInterval(roomPoll); roomPoll = null; }
}
function startRoomPoll(){
  stopRoomPoll();
  roomPoll = setInterval(()=>{ if(!document.getElementById('roomBody')){ stopRoomPoll(); return; } refreshRoom(); }, 6000);
}
async function refreshRoom(){
  if(!room || !room.id) return;
  try{
    roomCache = await cloudGet(room.id);
  }catch(e){ return; }
  paintRoom();
}

function openRoom(){

  root.querySelector('#rClose').addEventListener('click', ()=>{ stopRoomPoll(); closeModal(); });

}

      + '<div class="rv">' + (s ? esc(s.n || '（无名）') : '待选') + '</div></div>';
  }

    + '<div class="rm-bar"><span class="rm-badge' + (locked ? ' lock' : '') + '">' + (locked ? '已锁定发牌' : '选号中') + '</span>'
    + '<span style="font-size:12px;color:var(--muted)">已选 ' + picked + ' / ' + total + ' 个号</span>'
    + '<span style="flex:1"></span>'
    + '<button class="btn btn-sm" id="rmRef">刷新</button></div>'
    + '<div class="rm-bar"><button class="btn btn-primary" id="rmPush">同步当前身份到玩家手机</button>'
    + '<button class="btn btn-sm" id="rmUnlock">解锁重选</button>'
    + '<button class="btn btn-sm btn-danger" id="rmDrop">解散房间</button></div>'
    + '<div class="rm-seats">' + cells + '</div>'
    + '<div class="rm-note">链接发到群里，每人点进来选自己的号。<br>'
    + (locked
        ? '已锁定：身份已同步，玩家打开链接就能看到自己的牌。要重来请点「解锁重选」。'
        : '都选完之后，点「设置 → 随机发牌并开始」，身份会自动按座位同步。也可以现在就点上面的按钮把当前身份推上去。')
    + '</div>';

  const cp = el.querySelector('#rmCopy');
    if(cp) cp.addEventListener('click', ()=>{ fallbackCopy(link); toast('链接已复制，去群里粘贴'); });
  const rf = el.querySelector('#rmRef');
    if(rf) rf.addEventListener('click', ()=>{ refreshRoom(); toast('已刷新'); });
  const ps = el.querySelector('#rmPush');
    if(ps) ps.addEventListener('click', ()=>pushIdentities(false));
  const un = el.querySelector('#rmUnlock');
    if(un) un.addEventListener('click', doUnlockRoom);
  const dp = el.querySelector('#rmDrop');
    if(dp) dp.addEventListener('click', ()=>{
      if(!confirm('解散房间？玩家手里的链接会失效。')) return;
      writeRoom(null); roomCache = null; paintRoom(); toast('房间已解散');

}

async function doCreateRoom(){
  const b = document.getElementById('rmCreate');
  if(b){ b.disabled = true; b.textContent = '创建中…'; }
  const total = (state && state.players && state.players.length) ? state.players.length : 12;
  try{
    const data = { total, seats:{}, ids:{}, locked:false, ts: Date.now() };
    const id = await cloudCreate(data);
    writeRoom({ id, total, createdAt: Date.now() });
    roomCache = data;
    toast('房间已创建');
  }catch(e){
    toast('创建失败：' + (e.message || '网络问题') + '，再点一次试试');
  }
  paintRoom();
}

async function doUnlockRoom(){
  if(!room || !room.id) return;
  if(!confirm('解锁后玩家可以重新选号，已同步的身份会作废。确定吗？')) return;
  try{
    const base = roomCache || await cloudGet(room.id);
    await cloudPut(room.id, Object.assign({}, base, { locked:false, ids:{}, ts: Date.now() }));
    roomCache = null;
    await refreshRoom();
    toast('已解锁，玩家可以重新选号');
  }catch(e){
    toast('解锁失败：' + (e.message || '网络问题'));
  }
}

/* ==================== 玩家端：手机选号 / 翻牌 ==================== */

const CAMP_LABEL = { wolf:'狼人阵营', god:'神职阵营', vil:'平民阵营' };
const P = { rid:null, data:null, err:'', mySeat:null, busy:false, name:'', revealed:false, timer:null };

function plEl(){ return document.getElementById('plWrap'); }

function plToast(msg){
  let t = document.getElementById('plToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'plToast';
    t.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;'
      + 'padding:11px 18px;border-radius:10px;background:rgba(217,88,78,.94);color:#fff;'
      + 'font-size:13px;line-height:1.6;max-width:86vw;text-align:center;'
      + 'box-shadow:0 12px 30px rgba(0,0,0,.55);transition:opacity .25s;font-family:inherit';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.style.opacity = '0'; }, 2400);
}

function startPlayerMode(){
  const rid = hashRoomId();
  if(!rid) return false;
  P.rid = rid;
  document.body.classList.add('player-mode');
  const app = document.querySelector('.app');
  if(app) app.style.display = 'none';
  const root = document.getElementById('playerRoot');
  if(root) root.style.display = 'flex';
  try{ P.mySeat = parseInt(localStorage.getItem(SEAT_LS + rid) || '', 10) || null; }catch(e){ P.mySeat = null; }
  pPaint();
  pPull().then(pPaint);
  pLoop();
  return true;
}

async function pPull(){
  try{
    const d = await cloudGet(P.rid);
    P.data = d;
    P.err = '';
    if(P.mySeat){
      const s = (d.seats || {})[String(P.mySeat)];
      if(s && s.cid && s.cid !== clientId()){
        P.mySeat = null;
        try{ localStorage.removeItem(SEAT_LS + P.rid); }catch(e){}
        plToast('你的号被占用了，请重选一个');
      }
    }
  }catch(e){
    P.err = e.message || '网络异常';
  }
}

function pLoop(){
  if(P.timer) clearInterval(P.timer);
  P.timer = setInterval(async ()=>{
    if(!P.rid) return;
    if(P.data && P.data.locked && P.mySeat) return;
    const ae = document.activeElement;
    if(ae && ae.id === 'plName') return;
    await pPull();
    pPaint();
  }, 7000);
}

function pPaint(){
  const el = plEl();
  if(!el) return;
  const tag = document.getElementById('plSeatTag');
  if(tag){
    if(P.mySeat){ tag.style.display = ''; tag.textContent = '你的号 ' + String(P.mySeat).padStart(2,'0'); }
    else tag.style.display = 'none';
  }

  if(!P.data){
    if(P.err){
      el.innerHTML = '<div class="pl-wait"><div class="pl-big">连不上房间</div>'
        + '<div class="pl-sub">' + esc(P.err) + '<br>检查一下网络，或者再点一次。</div>'
        + '<button class="pl-btn primary" data-repull="1" style="margin-top:24px">重试</button></div>';
    }else{
      el.innerHTML = '<div class="pl-wait"><div class="ring"></div><div class="pl-big">正在进入房间…</div></div>';
    }
  }else if(!P.mySeat){
    el.innerHTML = pickHTML();
  }else if(!P.data.locked){
    el.innerHTML = waitHTML();
  }else{
    el.innerHTML = revealHTML();
  }
  bindPlayerEvents();
}

function pickHTML(){
  const d = P.data;
  const total = Math.max(1, Math.min(40, parseInt(d.total, 10) || 12));
  const seats = d.seats || {};
  let cells = '';
  for(let i=1;i<=total;i++){
    const s = seats[String(i)];
    cells += '<button class="pl-seat ' + (s ? 'taken' : '') + '" data-seat="' + i + '"' + (s ? ' disabled' : '') + '>'
      + i + '<small>' + (s ? '已选' : '可选') + '</small></button>';
  }
  return '<div class="pl-h1">选择你的座位号</div>'
    + '<div class="pl-sub">一个号只能被一个人选。选好后记住自己的号，整局都按这个号行动。</div>'
    + '<div class="pl-label">你的名字（可以留空）</div>'
    + '<input class="pl-input" id="plName" maxlength="12" placeholder="例如 Roy" value="' + esc(P.name) + '">'
    + '<div class="pl-label">座位号 · 共 ' + total + ' 个</div>'
    + '<div class="pl-grid">' + cells + '</div>'
    + '<div class="pl-note">点了就直接占号，别人再点会显示「已选」。点错了可以点下面的按钮换号。</div>';
}

function waitHTML(){
  const seat = String(P.mySeat).padStart(2,'0');
  return '<div class="pl-wait"><div class="ring"></div>'
    + '<div class="pl-big">你是 ' + seat + ' 号</div>'
    + '<div class="pl-sub">占号成功。等上帝统一下发身份后，这里会自动出现你的牌面。</div>'
    + '</div>'
    + '<div class="pl-note">页面会每 7 秒自己检查一次，不用手动刷新。</div>'
    + '<button class="pl-btn ghost" data-repull="1">立即检查</button>'
    + '<button class="pl-btn ghost" id="plChange">换一个号</button>';
}

function revealHTML(){
  const seat = String(P.mySeat).padStart(2,'0');
  const role = (P.data.ids || {})[String(P.mySeat)];
  if(!role || !ROLES[role]){
    return '<div class="pl-wait"><div class="ring"></div>'
      + '<div class="pl-big">你是 ' + seat + ' 号</div>'
      + '<div class="pl-sub">已经锁定了，但身份还没同步上来。稍等几秒，或者让上帝点「在线选号 → 同步当前身份」。</div>'
      + '</div><button class="pl-btn ghost" data-repull="1">重新获取</button>';
  }
  const r = ROLES[role];
  const on = !!P.revealed;
  return '<div class="pl-h1">你的身份</div>'
    + '<div class="pl-sub">只有你自己能看到。看完记得盖回去，别让旁边的人瞄到。</div>'
    + '<div class="pl-card ' + (on ? 'flip' : '') + '" id="plCard">'
    + '<div class="pc-seat">SEAT ' + seat + '</div>'
    + (on
        ? '<div class="pc-role" style="color:' + ROLE_COLOR[role] + '">' + r.name + '</div>'
          + '<div class="pc-camp">' + (CAMP_LABEL[r.camp] || '') + '</div>'
          + '<div class="pc-brief">' + esc(r.brief || '') + '</div>'
        : '<div class="pc-q">?</div><div class="pc-txt">点击翻开</div>')
    + '</div>'
    + '<div class="pl-tip">' + (on ? '再点一下卡片可以盖回去。' : '确认左右没人偷看，再翻开。') + '</div>'
    + '<button class="pl-btn ghost" data-repull="1">刷新身份</button>';
}

function bindPlayerEvents(){
  const el = plEl();
  if(!el) return;
  el.querySelectorAll('[data-seat]').forEach(b=>{
    b.addEventListener('click', ()=>pTake(parseInt(b.dataset.seat, 10)));
  });
  const nm = el.querySelector('#plName');
  if(nm) nm.addEventListener('input', ()=>{ P.name = nm.value; });
  const ch = el.querySelector('#plChange');
  if(ch) ch.addEventListener('click', pRelease);
  const card = el.querySelector('#plCard');
  if(card) card.addEventListener('click', ()=>{ P.revealed = !P.revealed; pPaint(); });
  el.querySelectorAll('[data-repull]').forEach(b=>{
    b.addEventListener('click', ()=>{ pPull().then(pPaint); });
  });
}

async function pTake(seat){
  if(P.busy || !seat) return;
  P.busy = true;
  const nmEl = document.getElementById('plName');
  const nm = ((nmEl && nmEl.value) || P.name || '').trim().slice(0, 12);
  try{
    const d = await cloudGet(P.rid);
    if(d.locked){ P.data = d; plToast('已经锁定发牌了，不能再选号'); return; }
    const seats = d.seats || {};
    if(seats[String(seat)]){ P.data = d; plToast('慢了一步，这个号刚被选走'); return; }
    seats[String(seat)] = { n: nm || (seat + '号'), cid: clientId(), t: Date.now() };
    await cloudPut(P.rid, Object.assign({}, d, { seats, ts: Date.now() }));
    P.mySeat = seat;
    P.name = nm;
    P.data = Object.assign({}, d, { seats });
    try{ localStorage.setItem(SEAT_LS + P.rid, String(seat)); }catch(e){}
  }catch(e){
    plToast('选号失败：' + (e.message || '网络问题') + '，再点一次试试');
  }finally{
    P.busy = false;
    pPaint();
  }
}

async function pRelease(){
  if(!P.mySeat) return;
  if(!confirm('放弃 ' + P.mySeat + ' 号，重新选一个？')) return;
  try{
    const d = await cloudGet(P.rid);
    if(d.locked){ plToast('已经开始发牌，不能换号了'); return; }
    const seats = d.seats || {};
    const mine = seats[String(P.mySeat)];
    if(mine && mine.cid === clientId()){
      delete seats[String(P.mySeat)];
      await cloudPut(P.rid, Object.assign({}, d, { seats, ts: Date.now() }));
    }
    P.mySeat = null;
    P.data = Object.assign({}, d, { seats });
    try{ localStorage.removeItem(SEAT_LS + P.rid); }catch(e){}
    pPaint();
  }catch(e){
    plToast('换号失败：' + (e.message || '网络问题'));
  }
}

function boot(){
  if(hashRoomId()){ startPlayerMode(); return; }
  const saved = load();
  if(saved && saved.players && saved.players.length){
    state = saved;
    if(!state.undos) state.undos = [];
    if(!state.night) state.night = {kill:null,save:false,poison:null,guard:null,guardPrev:null,seer:null,
                                    charm:null,copy:null,medium:null};
    ['charm','copy','medium'].forEach(k=>{ if(state.night[k] === undefined) state.night[k] = null; });
    if(state.night.custom === undefined) state.night.custom = {};
    if(!state.witch) state.witch = {saveUsed:false, poisonUsed:false};
    if(!state.votes) state.votes = {};
    if(!state.logs) state.logs = [];
    if(!state.revealed) state.revealed = {};
    if(state.boomUsed === undefined) state.boomUsed = false;
    if(state.duelUsed === undefined) state.duelUsed = false;
    if(!state.shotQueue) state.shotQueue = [];
    if(state.pendingShot && typeof state.pendingShot === 'number'){
      state.pendingShot = {seat: state.pendingShot, type: 'hunter'};
    }
    // 恢复自定义身份定义与板子信息（重新加载后全局角色表是空的）
    if(state.customCfg && state.customCfg.extra) registerCustomRoles(state.customCfg.extra);
    if(!state.config && state.customCfg && state.customCfg.extra) registerCustomRoles(state.customCfg.extra);
    if(!state.boardName) state.boardName = (BOARDS[state.boardKey] || {}).name || '对局';
    if(!state.config){
      const wolfs = state.players.map(p=>p.role).filter(r=>ROLES[r] && ROLES[r].camp==='wolf');
      const godz = state.players.map(p=>p.role).filter(r=>ROLES[r] && ROLES[r].camp==='god');
      state.config = {
        key: state.boardKey || 'custom',
        name: state.boardName || '对局',
        total: state.players.length,
        wolves: wolfs,
        gods: godz,
        extra: (state.customCfg && state.customCfg.extra) || []
      };
    }
    if(!state.census){
      const census = {wolf:0, god:0, vil:0};
      state.players.forEach(p=>{
        const camp = (ROLES[p.role] && ROLES[p.role].camp) || 'vil';
        census[camp === 'wolf' ? 'wolf' : (camp === 'god' ? 'god' : 'vil')] += 1;
      });
      state.census = census;
    }
    document.getElementById('actionZone').innerHTML = '';
    renderAll();
    tReset(state.speakSeconds || 90);
    setTimeout(()=>toast('已恢复上次对局：第 ' + state.day + (state.phase==='night'?'夜':'天')), 600);
  }else{
    state = createState('std12', null);
    state.started = false;
    openSetup(true);
  }
  bindEvents();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

})();
</script>



</body>
</html>
