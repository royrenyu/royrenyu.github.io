<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狼人杀 · 上帝控制台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06080e;
  --line:rgba(255,255,255,.075);
  --text:#e9ecf2;
  --muted:#8a93a6;
  --dim:#5d6678;
  --gold:#d8bd7a;
  --gold-2:#a8873f;
  --red:#d9584e;
  --blue:#5f9fd8;
  --green:#57b184;
  --violet:#9d7cd8;
  --orange:#e08b4a;
  --pink:#d07ea4;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1000px 620px at 14% -12%,rgba(110,145,215,.11),transparent 68%),
    radial-gradient(820px 520px at 88% 112%,rgba(205,170,95,.08),transparent 70%);
}
.serif{font-family:"Noto Serif SC",Georgia,"Songti SC",serif}

/* ============ 布局 ============ */
.app{
  position:relative;z-index:1;height:100vh;height:100dvh;
  display:grid;
  grid-template-columns:330px minmax(0,1fr) 288px;
  grid-template-rows:auto minmax(0,1fr);
}
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:9px 18px;min-height:58px;
  border-bottom:1px solid var(--line);background:rgba(10,13,20,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  flex-wrap:wrap;row-gap:8px;
}
.brand{display:flex;align-items:center;gap:9px;font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;letter-spacing:.04em;white-space:nowrap;flex:0 0 auto}
.brand .moon{
  width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff6dc,#d8bd7a 42%,#8a6c2c 100%);
  box-shadow:0 0 16px rgba(216,189,122,.45);flex:0 0 auto;
}
.status-chip{
  display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:99px;
  border:1px solid rgba(216,189,122,.24);background:rgba(216,189,122,.07);
  font-size:12.5px;color:#e4d9bd;white-space:nowrap;
  flex:0 1 auto;min-width:0;max-width:340px;overflow:hidden;
}
.status-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);flex:0 0 auto}
.status-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-spacer{flex:1 1 24px}
.topbar-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}

/* ============ 通用按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 13px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.045);color:var(--text);font-size:13px;
  font-family:inherit;cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(180deg,#e0c684,#b2913f);color:#1c1607;font-weight:700;
  border-color:rgba(255,255,255,.22);box-shadow:0 2px 10px rgba(180,145,63,.28);
}
.btn-primary:hover{background:linear-gradient(180deg,#ecd79c,#c2a049)}
.btn-danger{border-color:rgba(217,88,78,.35);color:#f0938b;background:rgba(217,88,78,.1)}
.btn-danger:hover{background:rgba(217,88,78,.2)}
.btn-sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn-lg{height:44px;font-size:15px;font-weight:600;border-radius:11px;width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ============ 左栏：流程 ============ */
.col-left{
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;padding:14px;gap:12px;
}
.stage-card{
  position:relative;border-radius:16px;padding:16px 16px 15px;overflow:hidden;
  background:linear-gradient(158deg,rgba(30,36,50,.92),rgba(15,18,26,.94));
  border:1px solid rgba(216,189,122,.2);
  box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
}
.stage-card::after{
  content:'';position:absolute;right:-40px;top:-46px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(216,189,122,.16),transparent 68%);
}
.stage-label{font-size:11px;letter-spacing:.2em;color:var(--gold);opacity:.85;margin-bottom:10px;text-transform:uppercase}
.stage-title{font-family:"Noto Serif SC",serif;font-size:23px;font-weight:700;line-height:1.3;letter-spacing:.02em;margin-bottom:12px}
.stage-title.night{color:#c9d6f0}
.stage-title.day{color:#f0dfba}
.quote{
  position:relative;padding:11px 13px 11px 15px;border-radius:10px;
  background:rgba(0,0,0,.28);border-left:2px solid rgba(216,189,122,.55);
  font-size:13px;line-height:1.72;color:#dfe4ef;
}
.quote .q-label{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--gold);opacity:.8;margin-bottom:5px}
.tip{
  margin-top:11px;font-size:12.5px;line-height:1.68;color:var(--muted);
  display:flex;gap:7px;
}
.tip::before{content:'▸';color:var(--gold);opacity:.7;flex:0 0 auto}
.hint-warn{
  margin-top:10px;padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.6;
  background:rgba(217,88,78,.1);border:1px solid rgba(217,88,78,.28);color:#f0a49c;
}
.hint-ok{
  margin-top:10px;padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.6;
  background:rgba(87,177,132,.1);border:1px solid rgba(87,177,132,.28);color:#8fd8b3;
}

/* 操作区 */
.action-box{margin-top:13px;padding-top:13px;border-top:1px dashed rgba(255,255,255,.1)}
.action-label{font-size:11px;letter-spacing:.13em;color:var(--muted);margin-bottom:9px}
.chip-target{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
  background:rgba(216,189,122,.09);border:1px solid rgba(216,189,122,.3);margin-bottom:10px;
  font-size:13px;
}
.chip-target .n{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  background:rgba(216,189,122,.2);color:var(--gold);font-weight:700;font-size:13px;
  font-variant-numeric:tabular-nums;
}
.chip-empty{
  padding:11px;border-radius:10px;border:1px dashed rgba(255,255,255,.14);color:var(--dim);
  font-size:12.5px;text-align:center;margin-bottom:10px;
}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row>*{flex:1}
.verdict{
  margin-top:10px;padding:15px;border-radius:12px;text-align:center;
  font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;letter-spacing:.06em;
}
.verdict.wolf{background:rgba(217,88,78,.14);border:1px solid rgba(217,88,78,.4);color:#f08d84}
.verdict.good{background:rgba(95,159,216,.14);border:1px solid rgba(95,159,216,.4);color:#8fc4ec}

/* 步骤条 */
.steps{display:flex;flex-direction:column;gap:2px}
.steps-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.steps-head span{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.step{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
  font-size:12.5px;color:var(--dim);cursor:pointer;transition:.15s;border:1px solid transparent;
}
.step:hover{background:rgba(255,255,255,.04);color:var(--muted)}
.step .idx{
  width:19px;height:19px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  font-size:10.5px;background:rgba(255,255,255,.07);color:var(--dim);font-variant-numeric:tabular-nums;
}
.step.done{color:#7f8a9e}
.step.done .idx{background:rgba(87,177,132,.16);color:#6fcf9f}
.step.active{color:var(--text);background:rgba(216,189,122,.1);border-color:rgba(216,189,122,.28);font-weight:500}
.step.active .idx{background:var(--gold);color:#1a1408;font-weight:700}
.step .meta{margin-left:auto;font-size:11px;color:var(--dim)}

/* ============ 中栏：座位板 ============ */
.col-main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.board-head{
  display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);
  background:rgba(12,15,23,.4);flex:0 0 auto;
}
.board-head h2{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.board-head .count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.board-head .spacer{flex:1}
.seat-wrap{padding:18px;overflow-y:auto;flex:1 1 auto;min-height:0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:12px;align-content:start}

.seat{
  position:relative;border-radius:14px;padding:14px 14px 12px;min-height:146px;
  background:linear-gradient(168deg,rgba(31,37,51,.92),rgba(15,18,26,.94));
  border:1px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;gap:5px;cursor:pointer;
  transition:transform .16s,border-color .16s,box-shadow .16s,opacity .2s;
  user-select:none;overflow:hidden;
}
.seat:hover{transform:translateY(-2px);border-color:rgba(216,189,122,.4);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.seat-no{
  position:absolute;top:10px;right:11px;font-size:11px;font-weight:700;
  color:rgba(255,255,255,.28);letter-spacing:.06em;font-variant-numeric:tabular-nums;
}
.seat-menu{
  position:absolute;right:36px;top:7px;width:20px;height:20px;border-radius:6px;
  display:grid;place-items:center;font-size:13px;color:rgba(255,255,255,.3);
  background:rgba(255,255,255,.05);opacity:0;transition:.15s;
}
.seat:hover .seat-menu{opacity:1}
.seat-menu:hover{background:rgba(255,255,255,.14);color:#fff}
.badge{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  font-family:"Noto Serif SC",serif;font-size:18px;font-weight:700;flex:0 0 auto;
  background:rgba(255,255,255,.07);color:#c9d0de;border:1px solid rgba(255,255,255,.1);
  transition:.2s;
}
.badge.hidden-id{background:rgba(255,255,255,.05);color:rgba(255,255,255,.25);font-size:15px}
.seat-name{font-size:14.5px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
.seat-role{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.seat-state{
  margin-top:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);
}
.seat-state .pip{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(87,177,132,.6)}

/* 角色配色（作用于徽章与文字） */
.seat[data-r="wolf"] .badge{background:rgba(217,88,78,.16);color:#f08079;border-color:rgba(217,88,78,.42)}
.seat[data-r="wolf"] .seat-role{color:#d9736c}
.seat[data-r="seer"] .badge{background:rgba(95,159,216,.16);color:#8fc4ec;border-color:rgba(95,159,216,.42)}
.seat[data-r="seer"] .seat-role{color:#7fb5df}
.seat[data-r="witch"] .badge{background:rgba(157,124,216,.16);color:#bda5ee;border-color:rgba(157,124,216,.42)}
.seat[data-r="witch"] .seat-role{color:#a992e0}
.seat[data-r="hunter"] .badge{background:rgba(224,139,74,.16);color:#f0ab74;border-color:rgba(224,139,74,.42)}
.seat[data-r="hunter"] .seat-role{color:#d99a66}
.seat[data-r="idiot"] .badge{background:rgba(208,126,164,.16);color:#e6a2c1;border-color:rgba(208,126,164,.42)}
.seat[data-r="idiot"] .seat-role{color:#cf8fb0}
.seat[data-r="guard"] .badge{background:rgba(87,177,132,.16);color:#83dcae;border-color:rgba(87,177,132,.42)}
.seat[data-r="guard"] .seat-role{color:#72bb98}
.seat[data-r="villager"] .badge{background:rgba(255,255,255,.07);color:#b9c2d2;border-color:rgba(255,255,255,.14)}
.seat[data-r="villager"] .seat-role{color:#9099aa}
/* 隐藏身份：徽章与文字一律去色，杜绝靠颜色猜身份 */
.seat[data-r="hidden"] .badge,
.seat[data-r="hidden"] .badge.hidden-id{
  background:rgba(255,255,255,.035);color:rgba(255,255,255,.22);
  border-color:rgba(255,255,255,.07);box-shadow:none;
}
.seat[data-r="hidden"] .seat-role{color:#68707f}

.seat.dead{opacity:.42;filter:grayscale(.55)}
.seat.dead .seat-name{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.seat.dead .pip{background:#8a9099;box-shadow:none}
.seat.target{
  border-color:transparent;
  box-shadow:0 0 0 2px rgba(230,200,120,.85),0 0 26px rgba(230,200,120,.28),inset 0 0 30px rgba(230,200,120,.06);
  transform:translateY(-2px);
}
.seat.shot-target{box-shadow:0 0 0 2px rgba(217,88,78,.8),0 0 26px rgba(217,88,78,.3);border-color:transparent;transform:translateY(-2px)}

/* 座位角标 */
.tagrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{
  font-size:9.5px;padding:2px 5px;border-radius:4px;letter-spacing:.04em;
  background:rgba(255,255,255,.1);color:#c3cad8;line-height:1.4;
}
.tag.guarded{background:rgba(87,177,132,.2);color:#83dcae}
.tag.voteless{background:rgba(255,255,255,.08);color:#9aa3b4}
.tag.poisoned{background:rgba(157,124,216,.2);color:#bda5ee}
.votecount{
  position:absolute;right:9px;bottom:7px;min-width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;font-size:12px;font-weight:700;
  background:rgba(216,189,122,.18);color:var(--gold);border:1px solid rgba(216,189,122,.4);
  font-variant-numeric:tabular-nums;
}
.votecount.top{background:rgba(217,88,78,.25);color:#ffb0a7;border-color:rgba(217,88,78,.55)}

/* ============ 日志条 ============ */
.logbar{
  flex:0 0 auto;border-top:1px solid var(--line);background:rgba(9,12,18,.82);
  display:flex;flex-direction:column;max-height:168px;
}
.logbar-head{
  display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid rgba(255,255,255,.05);
}
.logbar-head span{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.logbar-head .spacer{flex:1}
.log-list{
  overflow-y:auto;padding:8px 18px 12px;font-size:12.5px;line-height:1.9;
  font-variant-numeric:tabular-nums;
}
.log-list .empty{color:var(--dim);font-size:12px}
.log-item{display:flex;gap:9px;color:#a7b0c2}
.log-item .t{color:var(--dim);flex:0 0 auto;font-size:11.5px}
.log-item .txt{flex:1}
.log-item .txt strong{color:#e5d7b4;font-weight:600}
.log-item.danger .txt{color:#e9a29a}
.log-item.ok .txt{color:#8fd8b3}
.log-item.sys .txt{color:#8b95a8}

/* ============ 右栏 ============ */
.col-right{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:14px;gap:12px}
.panel{
  border-radius:14px;padding:14px;background:rgba(20,25,35,.62);
  border:1px solid var(--line);
}
.panel-title{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.panel-title .spacer{flex:1}

.timer-digits{
  font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1;text-align:center;
  letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#e8dfc6;
  text-shadow:0 0 24px rgba(216,189,122,.2);transition:color .3s;
  padding:6px 0 4px;
}
.timer-digits.warn{color:#ffb0a7;text-shadow:0 0 24px rgba(217,88,78,.35)}
.timer-digits.done{color:#8fd8b3;text-shadow:0 0 24px rgba(87,177,132,.3)}
.timer-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}
.timer-presets .btn{height:26px;padding:0;font-size:12px;border-radius:7px}
.timer-presets .btn.on{background:rgba(216,189,122,.18);color:var(--gold);border-color:rgba(216,189,122,.4)}
.timer-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{text-align:center;padding:8px 4px;border-radius:9px;background:rgba(255,255,255,.035)}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:10.5px;color:var(--dim);margin-top:3px}
.stat.w .v{color:#e8827a}
.stat.g .v{color:#8fc4ec}
.stat.v .v{color:#b9c2d2}

.mini-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.quick-list{display:flex;flex-direction:column;gap:6px}

/* ============ 弹窗 ============ */
.modal-mask{
  position:fixed;inset:0;z-index:60;background:rgba(4,6,11,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fade .2s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-height:90vh;border-radius:18px;overflow:hidden;
  background:linear-gradient(165deg,#1a1f2c,#0e1119);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  display:flex;flex-direction:column;
  animation:rise .25s cubic-bezier(.2,.9,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.modal-head h3{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:700;letter-spacing:.03em}
.modal-head .spacer{flex:1}
.modal-body{padding:20px;overflow-y:auto;flex:1 1 auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex:0 0 auto;background:rgba(0,0,0,.2)}

.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.05em}
.field .hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:.16s;
}
input:focus,textarea:focus,select:focus{border-color:rgba(216,189,122,.5);background:rgba(0,0,0,.5)}
textarea{resize:vertical;line-height:1.8}

.board-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.board-opt{
  padding:12px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.03);cursor:pointer;transition:.16s;
}
.board-opt:hover{border-color:rgba(216,189,122,.35);background:rgba(216,189,122,.06)}
.board-opt.on{border-color:rgba(216,189,122,.6);background:rgba(216,189,122,.11);box-shadow:0 0 0 1px rgba(216,189,122,.25) inset}
.board-opt .bn{font-size:13.5px;font-weight:600;margin-bottom:5px}
.board-opt .bd{font-size:11.5px;color:var(--dim);line-height:1.55}

.seg{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.seg button{
  flex:1;padding:9px;border:0;background:rgba(255,255,255,.03);color:var(--muted);
  font-family:inherit;font-size:12.5px;cursor:pointer;transition:.15s;
}
.seg button.on{background:rgba(216,189,122,.18);color:var(--gold);font-weight:600}

/* 发牌台 */
.deal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.card{
  aspect-ratio:1/1.2;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px),
    linear-gradient(160deg,#232a39,#131822);
  transition:.2s;position:relative;overflow:hidden;
  font-family:"Noto Serif SC",serif;
}
.card:hover{transform:translateY(-3px);border-color:rgba(216,189,122,.45);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.card .cn{position:absolute;top:7px;right:9px;font-size:11px;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.card .q{font-size:22px;color:rgba(255,255,255,.35)}
.card .back-txt{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.22)}
.card.flip{background:linear-gradient(160deg,#2b3345,#171d28)}
.card.flip .role-big{font-size:24px;font-weight:700;letter-spacing:.04em}
.card.flip .role-sub{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.card.flip .pname{font-size:11px;color:#aab3c5;margin-top:2px}

/* 逐张看牌 */
.deal-single{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0 4px}
.ds-title{font-family:"Noto Serif SC",serif;font-size:19px;font-weight:700;letter-spacing:.03em}
.ds-title span{color:var(--gold)}
.ds-sub{font-size:12.5px;color:var(--muted);margin-top:-8px}
.bigcard{
  width:250px;aspect-ratio:1/1.26;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;cursor:pointer;position:relative;
  border:1px solid rgba(255,255,255,.14);transition:transform .2s,border-color .2s,box-shadow .2s;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.026) 0 7px,transparent 7px 14px),
    linear-gradient(160deg,#232a39,#131822);
}
.bigcard:hover{transform:translateY(-3px);border-color:rgba(216,189,122,.5);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.bigcard.flip{background:linear-gradient(160deg,#2b3345,#171d28)}
.bigcard .bf-seat{position:absolute;top:11px;right:14px;font-size:12px;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.bigcard .bf-role{font-family:"Noto Serif SC",serif;font-size:29px;font-weight:900;letter-spacing:.06em;line-height:1.2}
.bigcard .bf-hint{font-size:11px;color:var(--muted);letter-spacing:.22em}
.bigcard .bf-q{font-size:46px;color:rgba(255,255,255,.26);font-family:"Noto Serif SC",serif;line-height:1}
.ds-progress{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:-6px}

/* 自定义板子配置 */
.cfg-top{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.cfg-top span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.cfg-top input{width:78px;padding:7px 10px}
.cfg-sub{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:13px 0 7px}
.cfg-gods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cfg-god{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:7px 6px 6px}
.cfg-god .gname{font-size:11px;color:var(--muted);text-align:center;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-god input{width:100%;padding:5px 4px;text-align:center;font-size:13px;border-radius:7px;font-variant-numeric:tabular-nums}
.cfg-xrow{display:flex;gap:7px;align-items:center;margin-top:8px}
.cfg-xrow .cfg-name-input{flex:1;min-width:0;width:auto;padding:7px 9px;font-size:12.5px}
.cfg-xrow .cfg-camp{width:86px;flex:0 0 auto;padding:7px 4px;font-size:12px}
.cfg-xrow .cfg-num{width:58px;flex:0 0 auto;padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums}
.cfg-wake{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.cfg-wake input{width:auto;flex:0 0 auto;margin:0;accent-color:#6fa8ff}

/* 角色池 */
.role-chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 2px}
.role-chip{
  display:flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);
  color:var(--muted);font-size:12.5px;font-family:inherit;transition:.14s;line-height:1;
}
.role-chip:hover{border-color:rgba(255,255,255,.22);color:var(--text)}
.role-chip.on{background:rgba(111,168,255,.14);border-color:rgba(111,168,255,.5);color:#e9ecf2}
.rc-badge{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1px solid;display:flex;
  align-items:center;justify-content:center;font-size:11px;background:rgba(0,0,0,.25);font-weight:600;
}
.role-chip.on .rc-badge{background:rgba(255,255,255,.12)}
.rc-name{white-space:nowrap}
.cfg-del{
  width:26px;height:26px;flex:0 0 auto;border-radius:6px;line-height:1;font-size:14px;cursor:pointer;
  border:1px solid rgba(217,88,78,.32);background:rgba(217,88,78,.1);color:#f0938b;font-family:inherit;
}
.cfg-del:hover{background:rgba(217,88,78,.2)}
select option{background:#1b2130;color:#e9ecf2}

/* 规则手册 */
.rule-tabs{display:flex;gap:6px;padding:0 20px 0;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.rule-tab{
  padding:10px 13px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:0;
  border-bottom:2px solid transparent;font-family:inherit;transition:.15s;
}
.rule-tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.rule-content{font-size:13.5px;line-height:1.95;color:#c6cddb}
.rule-content h4{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--gold);margin:18px 0 9px;font-weight:700}
.rule-content h4:first-child{margin-top:0}
.rule-content p{margin-bottom:10px}
.rule-content ul{margin:0 0 12px 18px}
.rule-content li{margin-bottom:6px}
.rule-content strong{color:#eaddbe;font-weight:600}
.rule-content .kbd{
  display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(216,189,122,.14);
  color:var(--gold);font-size:12px;margin:0 2px;
}
.rule-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px}
.rule-table th,.rule-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:top}
.rule-table th{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.04em}
.rule-table td{color:#b6bece}

/* ============ 大屏模式 ============ */
.screen{
  position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  transition:background .6s ease;
  background:radial-gradient(circle at 50% 32%,#151d33 0%,#080b13 62%,#040509 100%);
}
.screen.day{background:radial-gradient(circle at 50% 30%,#2b2418 0%,#12100c 60%,#07060a 100%)}
.screen .moon-orb{
  position:absolute;top:9%;width:86px;height:86px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fff9e3,#d8bd7a 45%,#7d6224 100%);
  box-shadow:0 0 60px rgba(216,189,122,.35),0 0 130px rgba(216,189,122,.16);
  transition:.6s;
}
.screen.day .moon-orb{background:radial-gradient(circle at 36% 32%,#ffe9b8,#e0a24a 45%,#8a5218 100%);box-shadow:0 0 70px rgba(224,162,74,.4)}
.screen .phase-top{font-size:13px;letter-spacing:.5em;color:rgba(255,255,255,.4);margin-bottom:8px;text-indent:.5em}
.screen .big-day{font-family:"Noto Serif SC",serif;font-size:15px;letter-spacing:.3em;color:var(--gold);opacity:.85;margin-bottom:26px}
.screen .line{
  font-family:"Noto Serif SC",serif;font-weight:900;line-height:1.5;letter-spacing:.06em;
  font-size:clamp(34px,5.2vw,72px);color:#f2eee2;
  text-shadow:0 0 42px rgba(216,189,122,.22),0 4px 30px rgba(0,0,0,.7);
  max-width:88vw;padding:0 20px;
}
.screen .subline{margin-top:26px;font-size:clamp(13px,1.3vw,17px);color:rgba(255,255,255,.45);letter-spacing:.16em}
.screen .screen-timer{
  margin-top:32px;font-family:"Noto Serif SC",serif;font-size:clamp(46px,7vw,96px);font-weight:900;
  font-variant-numeric:tabular-nums;color:#e8dfc6;letter-spacing:.06em;
  text-shadow:0 0 40px rgba(216,189,122,.25);
}
.screen .screen-timer.warn{color:#ff9c92;text-shadow:0 0 44px rgba(217,88,78,.45)}
.screen .exit{
  position:absolute;right:22px;bottom:20px;padding:8px 15px;border-radius:9px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.55);font-size:12px;cursor:pointer;font-family:inherit;
  opacity:.5;transition:.2s;
}
.screen .exit:hover{opacity:1;background:rgba(255,255,255,.14)}
.screen .win-banner{
  margin-top:18px;padding:10px 24px;border-radius:99px;font-family:"Noto Serif SC",serif;
  font-size:20px;font-weight:700;letter-spacing:.08em;
  background:rgba(216,189,122,.14);border:1px solid rgba(216,189,122,.45);color:var(--gold);
}

/* 座位操作浮层 */
.ctx-menu{
  position:fixed;z-index:70;width:186px;border-radius:12px;overflow:hidden;
  background:#1b2130;border:1px solid rgba(255,255,255,.13);
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  animation:fade .14s ease;
}
.ctx-menu .cm-head{padding:9px 12px;font-size:12px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.2)}
.ctx-menu button{
  display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;
  color:#c6cddb;font-family:inherit;font-size:12.5px;cursor:pointer;transition:.12s;
}
.ctx-menu button:hover{background:rgba(216,189,122,.12);color:#f0e4c8}
.ctx-menu .cm-sep{height:1px;background:rgba(255,255,255,.07)}
.ctx-menu .cm-sub{padding:6px 12px 3px;font-size:10.5px;letter-spacing:.12em;color:var(--dim)}
.ctx-menu .cm-roles{padding:2px 8px 9px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ctx-menu .cm-roles button{padding:6px 8px;border-radius:6px;font-size:12px;text-align:center;background:rgba(255,255,255,.04)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:90;
  padding:11px 20px;border-radius:11px;background:rgba(26,32,45,.95);
  border:1px solid rgba(216,189,122,.35);color:#e9dfc4;font-size:13px;
  box-shadow:0 12px 34px rgba(0,0,0,.5);animation:toastIn .25s ease;
  max-width:80vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}

/* 响应式 */
@media (max-width:1180px){
  .app{grid-template-columns:290px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .col-right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:190px;flex-direction:row;overflow-x:auto}
  .col-right .panel{min-width:230px}
  .seat{min-height:116px;padding:11px 12px}
  .badge{width:34px;height:34px;font-size:15px}
  .seat-name{font-size:13px;margin-top:6px}
  .board{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
  .seat-wrap{padding:12px 14px}
  .logbar{max-height:112px}
  .log-list{padding:6px 14px 8px;line-height:1.7}
}
@media (max-width:820px){
  .app{display:flex;flex-direction:column;grid-template-columns:none;grid-template-rows:none;
       height:auto;min-height:100vh;min-height:100dvh}
  .col-left{overflow:visible;max-height:none}
  .col-main{flex:0 0 auto;overflow:visible}
  .topbar{flex:0 0 auto;flex-wrap:wrap;row-gap:8px;padding:9px 12px}
  .topbar-actions{flex:1 1 100%;max-width:100%;flex-wrap:wrap;gap:6px}
  .topbar-actions .btn{padding:7px 9px;font-size:12px}
  .status-chip{max-width:100%}
  .col-left{border-right:0;border-bottom:1px solid var(--line);flex:0 0 auto;max-height:none;padding:12px}
  .col-main{flex:1 1 auto;min-height:0}
  .steps{display:none}
  .logbar{max-height:96px}
  .board{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .seat-wrap{padding:10px 12px}
  .seat{min-height:104px;padding:9px 9px 8px}
  .badge{width:32px;height:32px;font-size:14px}
  .deal-grid{grid-template-columns:repeat(3,1fr)}
  .cfg-gods{grid-template-columns:repeat(3,1fr)}
  /* 右侧三块面板在手机上改为纵向堆叠，否则横向滚动会把整页撑宽 */
  .col-right{flex-direction:column;max-height:none;overflow:visible;padding:12px;gap:10px}
  .col-right .panel{min-width:0;width:100%}
  .modal{margin:10px}
  .modal-body{padding:14px 14px}
  .modal-head{flex-wrap:wrap;row-gap:8px;padding:13px 14px}
  .modal-head h3{white-space:nowrap;flex:0 0 auto}
  .modal-foot{flex-wrap:wrap;row-gap:8px;padding:12px 14px}
  #dealFoot{flex:1 1 100%!important;font-size:11.5px!important}
  .board-opt{padding:8px 9px}
  .board-opt .bn{font-size:12.5px}
  .board-opt .bd{font-size:10.5px;line-height:1.5}
  .rule-tabs{padding:0 14px}
  .btn{min-height:36px}
}
@media (max-width:430px){
  .brand{font-size:13.5px}
  .topbar-actions .btn{padding:6px 8px;font-size:11.5px}
  .role-chips{gap:6px}
  .role-chip{padding:6px 9px 6px 6px;font-size:12px}
  .rc-badge{width:20px;height:20px;font-size:10px}
  .board{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
  .seat-no{font-size:10px}
  .seat-name{font-size:12.5px}
  .seat-role{font-size:11px}
}

/* ==================== 在线选号：上帝端面板 ==================== */
.rm-link{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
.rm-link input{flex:1 1 240px;min-width:0;height:40px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--text);padding:0 12px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.rm-link .btn{flex:0 0 auto}
.rm-seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin:12px 0 4px}
.rm-seat{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);min-width:0}
.rm-seat.on{border-color:rgba(216,189,122,.42);background:rgba(216,189,122,.08)}
.rm-seat .rn{font-size:11px;color:var(--dim);letter-spacing:.06em}
.rm-seat .rv{font-size:12.5px;margin-top:3px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-seat.on .rv{color:var(--gold)}
.rm-seat.empty .rv{color:var(--dim)}
.rm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 2px}
.rm-note{font-size:12px;color:var(--dim);line-height:1.75;margin-top:10px}
.rm-note b{color:var(--text);font-weight:500}
.rm-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:99px;
  border:1px solid rgba(87,177,132,.3);background:rgba(87,177,132,.08);color:var(--green)}
.rm-badge.lock{border-color:rgba(217,88,78,.32);background:rgba(217,88,78,.08);color:#e08a83}

/* ==================== 玩家端（手机选号 / 看牌） ==================== */
body.player-mode{overflow:auto}
.player-app{position:relative;z-index:1;display:none;flex-direction:column;min-height:100vh;min-height:100dvh}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line);background:rgba(10,13,20,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:6}
.pl-top .brand{font-size:14.5px}
.pl-seat-tag{font-size:12px;color:var(--gold);border:1px solid rgba(216,189,122,.32);
  padding:4px 10px;border-radius:99px;background:rgba(216,189,122,.09);white-space:nowrap}
.pl-wrap{width:100%;max-width:520px;margin:0 auto;padding:20px 18px calc(40px + env(safe-area-inset-bottom))}
.pl-h1{font-family:"Noto Serif SC",serif;font-size:23px;font-weight:700;letter-spacing:.02em;line-height:1.4}
.pl-sub{font-size:13px;color:var(--muted);line-height:1.75;margin-top:8px}
.pl-label{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:22px 0 8px}
.pl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pl-seat{position:relative;height:64px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--text);font-size:19px;font-weight:600;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:transform .12s,border-color .15s,background .15s;font-family:inherit;padding:0}
.pl-seat small{font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.04em}
.pl-seat:active{transform:scale(.97)}
.pl-seat.taken{border-color:rgba(217,88,78,.16);background:rgba(217,88,78,.055);color:var(--dim);cursor:not-allowed}
.pl-seat.taken small{color:rgba(217,88,78,.62)}
.pl-seat.mine{border-color:rgba(216,189,122,.62);background:rgba(216,189,122,.15);color:var(--gold);
  box-shadow:inset 0 0 0 1px rgba(216,189,122,.22)}
.pl-seat.mine small{color:var(--gold)}
.pl-input{width:100%;height:46px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--text);padding:0 14px;font-size:15px;font-family:inherit}
.pl-input::placeholder{color:var(--dim)}
.pl-btn{width:100%;height:48px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.055);color:var(--text);font-size:15px;font-weight:500;
  font-family:inherit;cursor:pointer;margin-top:10px;transition:transform .12s}
.pl-btn:active{transform:scale(.98)}
.pl-btn.primary{background:linear-gradient(180deg,#e3cd92,#bf9f59);border-color:rgba(216,189,122,.55);
  color:#191307;font-weight:700}
.pl-btn.ghost{height:42px;font-size:13px;color:var(--muted);background:transparent}
.pl-btn[disabled]{opacity:.5;cursor:not-allowed}
.pl-note{font-size:12px;color:var(--dim);line-height:1.8;margin-top:16px}
.pl-note b{color:var(--muted);font-weight:500}
.pl-wait{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 0 10px}
.pl-wait .ring{width:52px;height:52px;border-radius:50%;border:2px solid rgba(216,189,122,.22);
  border-top-color:var(--gold);animation:plspin 1.15s linear infinite;margin-bottom:22px}
@keyframes plspin{to{transform:rotate(360deg)}}
.pl-big{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:10px}
.pl-card{position:relative;margin:24px 0 4px;aspect-ratio:1/1.36;border-radius:20px;
  border:1px solid rgba(216,189,122,.26);background:linear-gradient(168deg,#12151d,#090b10);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04)}
.pl-card.flip{border-color:rgba(216,189,122,.55);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 60px rgba(216,189,122,.14)}
.pl-card .pc-q{font-family:"Noto Serif SC",serif;font-size:72px;line-height:1;color:rgba(216,189,122,.46)}
.pl-card .pc-txt{font-size:11px;letter-spacing:.26em;color:var(--dim);margin-top:16px}
.pl-card .pc-role{font-family:"Noto Serif SC",serif;font-size:42px;font-weight:900;line-height:1.2;letter-spacing:.04em}
.pl-card .pc-camp{font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:6px}
.pl-card .pc-brief{font-size:12.5px;color:var(--muted);line-height:1.75;padding:0 26px;text-align:center;margin-top:16px}
.pl-card .pc-seat{position:absolute;top:15px;left:18px;font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.pl-tip{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12.5px;
  color:var(--muted);line-height:1.7;margin-top:16px}

  .pl-grid{grid-template-columns:repeat(4,1fr);gap:8px}

}

</head>
<body>
<div class="app">
  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand"><span class="moon"></span>狼人杀 · 上帝控制台</div>
    <div class="status-chip" id="statusChip"><span class="dot"></span><span id="statusText">未开局</span></div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn" id="btnDeal">发牌台</button>
      <button class="btn" id="btnRoom">在线选号</button>
      <button class="btn" id="btnScreen">大屏模式</button>
      <button class="btn" id="btnRules">规则手册</button>
      <button class="btn" id="btnUndo">撤销</button>
      <button class="btn" id="btnSetup">设置</button>
      <button class="btn btn-danger" id="btnReset">重开</button>
    </div>
  </header>

  <!-- ===== 左栏：流程驱动 ===== -->
  <aside class="col-left">
    <div class="stage-card" id="stageCard">
      <div class="stage-label" id="stageLabel">当前阶段</div>
      <div class="stage-title" id="stageTitle">等待开局</div>
      <div class="quote"><span class="q-label">上帝台词</span><span id="stageQuote">先在「设置」里选择板子并填写玩家名单，然后点击开始对局。</span></div>
      <div class="tip" id="stageTip">一键随机发牌，上帝视角记录全流程。</div>
      <div id="actionZone"></div>
      <div class="btn-row">
        <button class="btn" id="btnPrev">上一步</button>
        <button class="btn btn-primary" id="btnNext">下一步</button>
      </div>
    </div>

    <div class="steps">
      <div class="steps-head">
        <span id="stepsTitle">阶段流程</span>
        <span id="stepsProgress" style="font-size:11px;color:var(--dim)"></span>
      </div>
      <div id="stepList"></div>
    </div>
  </aside>

  <!-- ===== 中栏：座位板 + 日志 ===== -->
  <section class="col-main">
    <div class="board-head">
      <h2>座位板</h2>
      <span class="count" id="aliveCount">0 / 0 人存活</span>
      <div class="spacer"></div>
      <button class="btn btn-sm" id="btnHideId">隐藏身份</button>
      <button class="btn btn-sm" id="btnMarkAllAlive">全员存活</button>
    </div>
    <div class="seat-wrap">
      <div class="board" id="board"></div>
    </div>
    <div class="logbar">
      <div class="logbar-head">
        <span>行动日志</span>
        <div class="spacer"></div>
        <button class="btn btn-sm" id="btnCopyLog" style="margin-right:6px">复制</button>
        <button class="btn btn-sm" id="btnClearLog">清空</button>
      </div>
      <div class="log-list" id="logList"><div class="empty">暂无记录。所有夜间行动、死亡与投票都会自动记在这里，方便复盘。</div></div>
    </div>
  </section>

  <!-- ===== 右栏：计时器 + 态势 ===== -->
  <aside class="col-right">
    <div class="panel">
      <div class="panel-title">发言 / 阶段计时器<div class="spacer"></div><span id="timerLabel" style="color:var(--dim)">—</span></div>
      <div class="timer-digits" id="timerDigits">00:00</div>
      <div class="timer-presets" id="timerPresets">
        <button class="btn" data-sec="30">30″</button>
        <button class="btn on" data-sec="90">90″</button>
        <button class="btn" data-sec="120">120″</button>
        <button class="btn" data-sec="180">180″</button>
      </div>
      <div class="timer-ctrl">
        <button class="btn" id="btnTimerToggle">开始</button>
        <button class="btn" id="btnTimerReset">归零</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">阵营态势</div>
      <div class="stat-grid">
        <div class="stat w"><div class="v" id="statWolf">0</div><div class="k">狼人存活</div></div>
        <div class="stat g"><div class="v" id="statGod">0</div><div class="k">神职存活</div></div>
        <div class="stat v"><div class="v" id="statVil">0</div><div class="k">平民存活</div></div>
      </div>
      <div class="mini-btn-row">
        <button class="btn btn-sm" id="btnNextSpeaker">下一位发言</button>
        <button class="btn btn-sm" id="btnCheckWin">判定胜负</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">快捷操作</div>
      <div class="quick-list">
        <button class="btn btn-sm" id="btnSkipNight">直接天亮</button>
        <button class="btn btn-sm" id="btnSkipToVote">跳到投票</button>
        <button class="btn btn-sm" id="btnGotoNight">进入夜晚</button>
      </div>
    </div>
  </aside>
</div>

<!-- ===== 玩家端：手机选号 / 看身份 ===== -->
<div class="player-app" id="playerRoot">
  <div class="pl-top">
    <div class="brand"><span class="moon"></span>狼人杀 · 入座</div>
    <div class="pl-seat-tag" id="plSeatTag" style="display:none"></div>
  </div>
  <div class="pl-wrap" id="plWrap"></div>
</div>

<!-- ===== 弹窗容器 ===== -->
<div id="modalRoot"></div>
<div id="ctxRoot"></div>

<!-- ===== 大屏模式 ===== -->
<div id="screenRoot"></div>

<script>
(function(){
'use strict';

/* ==================== 角色库 ==================== */
/* order = 夜间唤醒顺序；wake = 夜间环节类型；null 表示夜里不睁眼 */
const ROLE_DEFS = {
  wolf:     {name:'狼人',   badge:'狼', camp:'wolf', color:'#f08079', order:2, wake:'kill',   brief:'夜晚集体商议击杀'},
  whiteWolf:{name:'白狼王', badge:'白', camp:'wolf', color:'#f2928a', order:2, wake:'kill',   brief:'白天自爆带走一人'},
  blackWolf:{name:'黑狼王', badge:'黑', camp:'wolf', color:'#c96a62', order:2, wake:'kill',   brief:'出局时可带走一人'},
  mechWolf: {name:'机械狼', badge:'机', camp:'wolf', color:'#dc9a9a', order:2.3, wake:'copy',  brief:'单独睁眼复制一人技能'},
  beauty:   {name:'狼美人', badge:'美', camp:'wolf', color:'#e8a9c4', order:2.6, wake:'charm', brief:'单独睁眼魅惑一人，出局时同死'},
  guard:    {name:'守卫',   badge:'守', camp:'god',  color:'#83dcae', order:1, wake:'guard',  brief:'每晚守护一人，不可连守'},
  witch:    {name:'女巫',   badge:'女', camp:'god',  color:'#bda5ee', order:3, wake:'witch',  brief:'解药与毒药各一瓶'},
  seer:     {name:'预言家', badge:'预', camp:'god',  color:'#8fc4ec', order:4, wake:'seer',   brief:'每晚查验一人阵营'},
  medium:   {name:'通灵师', badge:'灵', camp:'god',  color:'#7fd3c8', order:5, wake:'medium', brief:'每晚查验一名玩家的真实身份'},
  hunter:   {name:'猎人',   badge:'猎', camp:'god',  color:'#f0ab74', order:6, wake:'notice', brief:'出局时可开枪'},
  knight:   {name:'骑士',   badge:'骑', camp:'god',  color:'#9fc7e8', order:null, wake:null,  brief:'白天决斗，狼死或骑士死'},
  idiot:    {name:'白痴',   badge:'白', camp:'god',  color:'#e6a2c1', order:null, wake:null,  brief:'被投出翻牌免死'},
  villager: {name:'村民',   badge:'民', camp:'vil',  color:'#b9c2d2', order:null, wake:null,  brief:'无技能'}
};
const ROLES = ROLE_DEFS;
const ROLE_COLOR = {};
Object.keys(ROLE_DEFS).forEach(k=>{ ROLE_COLOR[k] = ROLE_DEFS[k].color; });

const CAUSE_LABEL = {
  wolf:'狼人击杀', poison:'女巫毒杀', vote:'投票放逐', shot:'猎人枪杀',
  pierce:'技能带走', beauty:'狼美人魅惑', duel:'骑士决斗', boom:'白狼王自爆', other:'其他原因'
};

const WOLF_POOL = ['whiteWolf','blackWolf','mechWolf','beauty'];
const GOD_POOL = ['seer','witch','guard','hunter','knight','idiot','medium'];
const STANDARD_GODS = GOD_POOL;

/* 板子配置：wolves / gods 都是角色 key 数组，村民数量自动补足 */
const BOARDS = {
  std12:  {name:'12人标准局',     total:12, wolves:['wolf','wolf','wolf','wolf'], gods:['seer','witch','hunter','idiot']},
  guard12:{name:'12人守卫局',     total:12, wolves:['wolf','wolf','wolf','wolf'], gods:['seer','witch','hunter','guard']},
  mech:   {name:'12人机械狼通灵师',total:12, wolves:['wolf','wolf','mechWolf','beauty'], gods:['seer','witch','medium','knight']},
  wking:  {name:'12人狼王守卫',   total:12, wolves:['whiteWolf','wolf','wolf','wolf'], gods:['seer','witch','guard','hunter']},
  all13:  {name:'13人全狼王局',   total:13, wolves:['whiteWolf','blackWolf','mechWolf','beauty'], gods:['seer','witch','guard','knight','medium']},
  ten:    {name:'10人竞技局',     total:10, wolves:['wolf','wolf','wolf'], gods:['seer','witch','hunter']},
  nine:   {name:'9人快局',        total:9,  wolves:['wolf','wolf','wolf'], gods:['seer','witch','hunter']},
  six:    {name:'6人新手局',      total:6,  wolves:['wolf','wolf'],        gods:['seer','witch']}
};

function cfgVillagers(cfg){
  return cfg.total - cfg.wolves.length - cfg.gods.length;
}
function cfgDesc(cfg){
  const w = cfg.wolves.filter(k=>k!=='wolf').length;
  const wtxt = cfg.wolves.length + '狼' + (w ? '（含 '+cfg.wolves.filter(k=>k!=='wolf').map(k=>ROLES[k].name).join('/')+'）' : '');
  const gtxt = cfg.gods.map(k=>ROLES[k].name).join('/');
  const v = cfgVillagers(cfg);
  return wtxt + ' · ' + (gtxt || '无神') + ' · ' + v + '民';
}
function boardCfg(key){
  const b = BOARDS[key] || BOARDS.std12;
  return {key, name:b.name, total:b.total, wolves:b.wolves.slice(), gods:b.gods.slice()};
}

const CUSTOM_PALETTE = ['#9fc7e8','#bda5ee','#83dcae','#e6a2c1','#f0ab74','#a9b8e0','#8ad8d0'];

/* 把自定义身份注册进全局角色表，后续所有渲染、流程与判定都能直接使用 */
function registerCustomRoles(defs){
  (defs || []).forEach((d,i)=>{
    const key = d.key || ('c' + i);
    ROLE_DEFS[key] = {
      name: d.name,
      badge: d.badge || d.name.slice(0,1),
      camp: d.camp === 'wolf' ? 'wolf' : (d.camp === 'vil' ? 'vil' : 'god'),
      color: d.color || CUSTOM_PALETTE[i % CUSTOM_PALETTE.length],
      order: d.wake ? (d.order || 5.5) : null,
      wake: d.wake || null,
      brief: d.brief || '自定义身份'
    };
    ROLE_COLOR[key] = ROLE_DEFS[key].color;
  });
}

const LS_KEY = 'ww_dm_console_v1';

/* ==================== 状态 ==================== */
let state = null;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function fmtSeat(n){ return String(n).padStart(2,'0'); }
function getP(seat){ return state.players.find(p=>p.seat===seat); }
function aliveRole(role){ return state.players.some(p=>p.alive && p.role===role); }
function aliveGhost(){ return state.players.filter(p=>p.alive); }

function createState(cfgOrKey, names){
  let cfg;
  if(typeof cfgOrKey === 'string'){ cfg = boardCfg(cfgOrKey); }
  else { cfg = JSON.parse(JSON.stringify(cfgOrKey)); }
  if(cfg.extra && cfg.extra.length) registerCustomRoles(cfg.extra);

  const pool = cfg.wolves.concat(cfg.gods);
  (cfg.extra || []).forEach(x=>{ for(let i=0;i<(x.count||1);i++) pool.push(x.key); });
  const vil = Math.max(0, cfg.total - pool.length);
  for(let i=0;i<vil;i++) pool.push('villager');

    // 开局各阵营人数，用于屠边判定（避免"没有村民"被误判成屠民）
  const census = {wolf:0, god:0, vil:0};
  pool.forEach(r=>{
    const camp = (ROLES[r] && ROLES[r].camp) || 'vil';
    census[camp === 'wolf' ? 'wolf' : (camp === 'god' ? 'god' : 'vil')] += 1;
  });

  shuffle(pool);
  return {
    started: true,
    boardKey: cfg.key || 'custom',
    boardName: cfg.name || ('自定义局（' + cfg.total + ' 人）'),
    boardDesc: cfgDesc(cfg),
    customCfg: (cfg.extra && cfg.extra.length) ? cfg : null,
    config: cfg,
    census,
    mode: 'side',
    speakSeconds: 90,
    players: pool.map((role,i)=>({
      seat: i+1,
      name: (names && names[i] && names[i].trim()) ? names[i].trim() : (i+1)+'号位',
      role,
      alive: true,
      death: null,
      tags: []
    })),
    day: 1,
    phase: 'night',
    stepKey: 'nightfall',
    pickMode: null,
    night: {kill:null, save:false, poison:null, guard:null, guardPrev:null, seer:null,
            charm:null, copy:null, medium:null},
    witch: {saveUsed:false, poisonUsed:false},
    boomUsed: false,
    duelUsed: false,
    votes: {},
    logs: [],
    identityHidden: false,
    pendingShot: null,
    shotTarget: null,
    speakPointer: null,
    win: null,
    revealed: {},
    dawnResolved: false,
    exileResolved: false,
    screenMode: false,
    undos: []
  };
}

/* ==================== 存档 ==================== */
function save(){
  try{
    if(!state || !state.started) return;
    const clone = Object.assign({}, state); delete clone.undos;
    localStorage.setItem(LS_KEY, JSON.stringify(clone));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    s.undos = [];
    return s;
  }catch(e){ return null; }
}
function snap(){
  try{
    const clone = Object.assign({}, state); clone.undos = [];
    state.undos.push(JSON.stringify(clone));
    if(state.undos.length > 20) state.undos.shift();
  }catch(e){}
}
function undo(){
  if(!state.undos.length){ toast('没有可撤销的操作'); return; }
  const prev = JSON.parse(state.undos.pop());
  const undos = state.undos;
  state = prev;
  state.undos = undos;
  renderAll();
  toast('已撤销上一步');
}

/* ==================== 阶段流程定义 ==================== */
function pickOf(wake){
  return ({kill:'kill', guard:'guard', seer:'seer', seer2:'pick', medium:'medium',
           witch:null, notice:null, pick:'pick', copy:'copy', charm:'charm'})[wake] || null;
}

/* 收集当前夜里需要唤醒的角色：普通狼合并为一个环节，
   机械狼复制、狼美人魅惑各自单独睁眼 */
function nightActors(){
  const found = {};
  state.players.forEach(p=>{
    if(!p.alive) return;
    const d = ROLES[p.role];
    if(!d || d.order == null || !d.wake) return;
    found[p.role] = true;
  });
  const list = Object.keys(found)
    .map(r=>({role:r, order:ROLES[r].order, wake:ROLES[r].wake, camp:ROLES[r].camp}))
    .sort((a,b)=>a.order-b.order);

  const out = [];
  // 只要还有狼存活就开「狼人合议刀人」，机械狼/狼美人也一起参与刀人
  if(list.some(a=>a.camp === 'wolf')){
    out.push({role:'wolf', order:2, wake:'kill'});
  }
  list.forEach(a=>{
    if(a.camp === 'wolf' && a.wake === 'kill') return;  // 已并入狼人环节
    out.push({role:a.role, order:a.order, wake:a.wake});
  });
  return out.sort((a,b)=>a.order-b.order);
}

function nightStepFor(a){
  const d = ROLES[a.role] || {name:'角色'};
  const nm = d.name;
  const k = state.night.kill;
  let title, quote, tip;

  switch(a.wake){
    case 'kill':
      title = '狼人请睁眼';
      quote = '狼人请睁眼，互相确认队友后，决定今晚要击杀谁。';
      tip = '点选一个座位作为击杀目标；狼队决定空刀时点「空刀」。';
      if(aliveRole('beauty')) tip += ' 狼美人另需指认一名魅惑对象。';
      if(aliveRole('mechWolf')) tip += ' 机械狼可指认一人复制其技能。';
      if(aliveRole('whiteWolf')) tip += ' 白狼王若今晚想自爆，等到白天再处理。';
      return {key:'wolf', role:'wolf', pick:'kill', wake:'kill', title, screen:title, quote, tip};

    case 'guard':
      title = '守卫请睁眼';
      quote = '守卫请睁眼。请选择今晚要守护的人。';
      tip = '点选座位记录守护目标。守卫不可连续两晚守护同一人。';
      return {key:'r_guard', role:'guard', pick:'guard', wake:'guard', title, screen:title, quote, tip};

    case 'witch':
      title = '女巫请睁眼';
      quote = '女巫请睁眼。' + (k ? ('今晚被刀的是 ' + fmtSeat(k) + ' 号。') : '今晚没有人被刀。');
      tip = '先低声告知死讯，再问是否使用解药或毒药。';
      return {key:'r_witch', role:'witch', pick:null, title, screen:title, quote, tip};

    case 'seer':
    case 'seer2':
      title = nm + '请睁眼';
      quote = nm + '请睁眼。请选择今晚要查验的人。';
      tip = '点选座位后向 ta 单独示意：好人还是狼人。';
      return {key:'r_'+a.role, role:a.role, pick:a.wake, wake:a.wake, title, screen:title, quote, tip};

    case 'copy': {
      title = nm + '请睁眼';
      quote = nm + '请睁眼。请单独选择一名玩家，复制 ta 的技能。';
      tip = '这个环节只有机械狼睁眼，狼队其他人不参与。点选座位记录复制对象；复制后是当晚生效还是次晚生效，开局前口头约定。';
      return {key:'r_'+a.role, role:a.role, pick:'copy', wake:'copy', title, screen:title, quote, tip};
    }

    case 'charm': {
      title = nm + '请睁眼';
      quote = nm + '请睁眼。请单独选择今晚要魅惑的人。';
      tip = '这个环节只有狼美人睁眼，被魅惑者不会被告知。狼美人出局时，被魅惑者一同出局。';
      if(state.charmPrev) tip += ' 上一夜魅惑的是 ' + fmtSeat(state.charmPrev) + ' 号，原则上不可连续两晚魅惑同一人。';
      return {key:'r_'+a.role, role:a.role, pick:'charm', wake:'charm', title, screen:title, quote, tip};
    }

    case 'medium':
      title = nm + '请睁眼';
      quote = nm + '请睁眼。请选择一名玩家，查看 ta 的真实身份。';
      tip = '今晚可查任意一位玩家，存活或已出局都行；查到的是具体身份牌，不只是阵营。每回合限查一人。';
      return {key:'r_'+a.role, role:a.role, pick:'medium', wake:'medium', title, screen:title, quote, tip};

    case 'notice':
      title = nm + '请睁眼';
      if(a.role === 'hunter'){
        quote = '猎人请睁眼，' + (k ? ('今晚 ' + fmtSeat(k) + ' 号倒牌。') : '今晚很平静。');
        tip = '只告知是否被刀；不要透露被毒。';
      } else {
        quote = nm + '请睁眼。' + (d.brief || '');
        tip = '按你们的村规让 ta 行动，本步骤只做唤醒与记录。';
      }
      return {key:'r_'+a.role, role:a.role, pick:null, wake:a.wake, title, screen:title, quote, tip};

    case 'pick':
    default:
      title = nm + '请睁眼';
      quote = nm + '请睁眼。请选择今晚要指定的目标。';
      tip = '点选座位记录目标；' + (d.brief || '按你们的约定结算。');
      return {key:'r_'+a.role, role:a.role, pick:'pick', wake:'pick', title, screen:title, quote, tip};
  }
}

function buildSteps(){
  if(state.phase === 'night'){
    const out = [];
    out.push({key:'nightfall', title:'天黑请闭眼', screen:'天黑请闭眼',
      quote:'天黑请闭眼。所有人闭眼，第 ' + state.day + ' 夜开始。',
      tip:'确认全员闭眼、手机放好，再依次唤醒角色。'});

    nightActors().forEach(a=>{
      if(a.role === 'witch' && state.witch.saveUsed && state.witch.poisonUsed) return;
      out.push(nightStepFor(a));
    });

    out.push({key:'dawn', title:'天亮了', screen:'天亮了',
      quote:'天亮了，请大家睁眼。',
      tip:'先公布昨夜出局名单（或平安夜），再点「宣布出局」把出局者标记。'});
    return out;
  }

  const daySteps = [];
  if(aliveRole('knight') && !state.duelUsed){
    daySteps.push({key:'knight', title:'骑士决斗', screen:'骑士请举手',
      quote:'有骑士吗？若要发起决斗，请现在举手并指定一名玩家。',
      tip:'点选决斗目标：若是狼人则对方当场出局，若不是狼人则骑士自己出局。一局只能决斗一次。',
      pick:'duel'});
  }
  daySteps.push(
    {key:'debate', title:'白天发言', screen:'白天发言',
      quote:'现在进入白天发言，请按顺序轮流发言。',
      tip:'用右栏计时器控制每人时长；「下一位发言」自动跳到下一个存活座位。'},
    {key:'vote', title:'投票放逐', screen:'请投票',
      quote:'发言结束。所有人投票，得票最多者出局。',
      tip:'收票时点座位累加票数；点票数角标可减一票。'},
    {key:'exile', title:'放逐结算', screen:'投票结束',
      quote:'投票结束。',
      tip:'公布票型与被放逐者，点「确认放逐」，再让其发表遗言。'}
  );
  return daySteps;
}

function steps(){ return buildSteps(); }
function curStep(){
  const list = steps();
  return list.find(s=>s.key===state.stepKey) || list[0];
}
function stepIndex(){
  return steps().findIndex(s=>s.key===state.stepKey);
}

function defaultPick(key){
  return ({wolf:'kill', seer:'seer', guard:'guard', vote:'vote'})[key] || null;
}

function setStep(key){
  state.stepKey = key;
  const cur = steps().find(s=>s.key===key);
  state.pickMode = (cur && cur.pick) ? cur.pick : null;
  state.shotTarget = null;
  renderAll();
}

function goNext(){
  const list = steps();
  let i = list.findIndex(s=>s.key===state.stepKey);
  if(i < 0) i = 0;
  const cur = list[i];

  if(cur.key === 'dawn' && !state.dawnResolved){ resolveDawn(); }
  if(cur.key === 'exile' && !state.exileResolved){ doExile(); }

  if(i < list.length - 1){
    setStep(list[i+1].key);
    return;
  }
  // 列表结束：跨阶段
  snap();
  if(state.phase === 'night'){
    state.phase = 'day';
    state.pickMode = null;
    state.speakPointer = null;
    state.votes = {};
    const dList = steps();
    state.stepKey = (dList[0] || {key:'debate'}).key;
    renderAll();
  }else{
    startNewNight();
  }
}

function goPrev(){
  const list = steps();
  let i = list.findIndex(s=>s.key===state.stepKey);
  if(i > 0){ setStep(list[i-1].key); return; }
  toast('本阶段已是第一步');
}

function startNewNight(){
  snap();
  const prevGuard = state.night.guard;
  const prevCharm = state.night.charm;
  state.day += 1;
  state.phase = 'night';
  state.stepKey = 'nightfall';
  state.pickMode = null;
  state.night = {kill:null, save:false, poison:null, guard:null, guardPrev:prevGuard, seer:null,
                 charm:null, copy:null, medium:null};
  state.charmPrev = prevCharm || null;
  state.votes = {};
  state.speakPointer = null;
  state.dawnResolved = false;
  state.exileResolved = false;
  state.shotTarget = null;
  state.win = null;
  renderAll();
  toast('第 ' + state.day + ' 夜开始');
}

/* ==================== 死亡 / 技能 ==================== */
/* 需要"带走一人"的技能排队，避免狼美人连锁时互相覆盖 */
function requestShot(seat, type){
  if(!state.pendingShot){ state.pendingShot = {seat, type}; }
  else { state.shotQueue = state.shotQueue || []; state.shotQueue.push({seat, type}); }
}
function nextShot(){
  state.pendingShot = null;
  state.shotTarget = null;
  if(state.shotQueue && state.shotQueue.length){
    state.pendingShot = state.shotQueue.shift();
  }
}
function shotHolderText(type){
  if(type === 'blackWolf') return '黑狼王';
  if(type === 'whiteWolf') return '白狼王';
  return '猎人';
}

function killSeat(seat, cause){
  const p = getP(seat);
  if(!p || !p.alive) return false;
  if(p.role === 'idiot' && cause === 'vote' && !p.tags.includes('flipped')){
    p.tags.push('flipped','novote');
    log('白痴 '+fmtSeat(seat)+' 号 '+p.name+' 被投出，翻牌免死，本局失去投票权', 'ok');
    toast('白痴翻牌免死，仍留在场上（无投票权）');
    return true;
  }
  p.alive = false;
  p.death = {day: state.day, phase: state.phase, cause};
  log(fmtSeat(seat)+' 号 '+p.name+' 出局（'+CAUSE_LABEL[cause]+'）', 'danger');

  /* ---------- 死后技能 ---------- */
  if(p.role === 'hunter'){
    if(cause === 'poison' || cause === 'beauty'){
      log('猎人被' + (cause === 'poison' ? '毒杀' : '狼美人带走') + '，本局无法开枪', 'sys');
    }else if(!p.tags.includes('shotUsed')){
      requestShot(seat, 'hunter');
      log('猎人技能触发：可开枪带走一名玩家', 'sys');
    }
  }
  if(p.role === 'blackWolf' && !p.tags.includes('shotUsed')){
    if(cause === 'vote' || cause === 'shot' || cause === 'pierce' || cause === 'wolf' || cause === 'duel' || cause === 'boom'){
      requestShot(seat, 'blackWolf');
      log('黑狼王技能触发：可带走一名玩家', 'sys');
    }
  }
  if(p.role === 'beauty' && cause !== 'beauty'){
    const charm = state.night.charm || state.charmLast;
    if(charm){
      const t = getP(charm);
      if(t && t.alive){
        log('狼美人 '+fmtSeat(seat)+' 号出局，其魅惑对象 '+fmtSeat(charm)+' 号 '+t.name+' 一同出局', 'danger');
        killSeat(charm, 'beauty');
      }
    }
  }

  updateWin();
  renderAll();
  return true;
}

function updateWin(){
  if(state.win) return;
  const alive = aliveGhost();
  const w = alive.filter(p=>ROLES[p.role].camp==='wolf').length;
  const g = alive.filter(p=>ROLES[p.role].camp==='god').length;
  const v = alive.filter(p=>ROLES[p.role].camp==='vil').length;
  const c = state.census || {wolf:4, god:4, vil:4};
  let res = null;
  if(w === 0) res = {winner:'good', text:'好人阵营胜利'};
  else if(state.mode === 'side'){
    if(c.god > 0 && g === 0) res = {winner:'wolf', text:'狼人阵营胜利 · 屠神'};
    else if(c.vil > 0 && v === 0) res = {winner:'wolf', text:'狼人阵营胜利 · 屠民'};
  }else{
    if(g === 0 && v === 0) res = {winner:'wolf', text:'狼人阵营胜利 · 屠城'};
  }
  if(res){
    state.win = res;
    log('对局结束：' + res.text, res.winner==='good' ? 'ok' : 'danger');
    toast(res.text);
    soundWin();
  }
}

/* 计算昨夜死亡名单（不改状态） */
function computeDeaths(){
  const n = state.night, out = [];
  if(n.kill && !n.save && n.guard !== n.kill) out.push({seat:n.kill, cause:'wolf'});
  if(n.poison && n.poison !== n.kill) out.push({seat:n.poison, cause:'poison'});
  return out;
}

function resolveDawn(){
  if(state.dawnResolved) return;
  const deaths = computeDeaths();
  state.dawnResolved = true;
  if(!deaths.length){
    log('昨夜是平安夜，无人出局', 'ok');
    renderAll();
    toast('平安夜');
    return;
  }
  const names = deaths.map(d=>fmtSeat(d.seat)+'号 '+getP(d.seat).name);
  log('公布昨夜死讯：' + names.join('、'), 'danger');
  deaths.forEach(d=>killSeat(d.seat, d.cause));
  renderAll();
}

function doExile(){
  if(state.exileResolved) return;
  const votes = state.votes;
  const entries = Object.entries(votes).filter(([k,v])=>v>0).map(([k,v])=>({seat:+k, v}));
  if(!entries.length){ toast('还没有记录任何票数'); return; }
  const max = Math.max(...entries.map(e=>e.v));
  const top = entries.filter(e=>e.v===max);
  if(top.length > 1){
    state.exileResolved = false;
    log('投票平票：' + top.map(t=>fmtSeat(t.seat)+'号('+t.v+'票)').join('、') + '，需 PK 或重新投票', 'sys');
    toast('平票！请 PK 发言后重投，或手动处理');
    return;
  }
  state.exileResolved = true;
  log('投票结果：' + fmtSeat(top[0].seat) + ' 号以 ' + max + ' 票被放逐', 'danger');
  killSeat(top[0].seat, 'vote');
}

/* ==================== 日志 ==================== */
function log(text, type){
  state.logs.push({t:'第'+state.day+(state.phase==='night'?'夜':'天'), text, type:type||''});
  if(state.logs.length > 400) state.logs.shift();
  renderLog();
}
function renderLog(){
  const el = document.getElementById('logList');
  if(!el) return;
  if(!state.logs.length){
    el.innerHTML = '<div class="empty">暂无记录。所有夜间行动、死亡与投票都会自动记在这里，方便复盘。</div>';
    return;
  }
  el.innerHTML = state.logs.map(l=>
    '<div class="log-item '+l.type+'"><span class="t">'+l.t+'</span><span class="txt">'+esc(l.text)+'</span></div>'
  ).join('');
  el.scrollTop = el.scrollHeight;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ==================== 渲染 ==================== */
function renderAll(){
  renderTop();
  renderStage();
  renderSteps();
  renderBoard();
  renderStats();
  renderLog();
  renderHeaderButtons();
  renderScreen();
  save();
}

function renderHeaderButtons(){
  const b = document.getElementById('btnHideId');
  if(b) b.textContent = state.identityHidden ? '显示身份' : '隐藏身份';
  const u = document.getElementById('btnUndo');
  if(u) u.disabled = !state.undos.length;
}

function renderTop(){
  const st = curStep();
  const stEl = document.getElementById('statusText');
  if(state.win){
    stEl.textContent = state.win.text;
    return;
  }
  stEl.textContent = '第 ' + state.day + (state.phase==='night'?'夜':'天') + ' · ' + (st ? st.screen : '待开局');
}

function renderStage(){
  const st = curStep();
  const wrap = document.getElementById('stageCard');
  document.getElementById('stageLabel').textContent = '第 ' + state.day + (state.phase==='night'?'夜 · 夜晚':'天 · 白天');
  const tEl = document.getElementById('stageTitle');
  tEl.textContent = state.win ? state.win.text : st.title;
  tEl.className = 'stage-title ' + (state.phase==='night' ? 'night' : 'day');
  document.getElementById('stageQuote').textContent = state.win
    ? '本局已结束。可以点「重开」重新发牌，或点「发牌台」查看本局身份。'
    : st.quote;
  document.getElementById('stageTip').textContent = st.tip;

  document.getElementById('actionZone').innerHTML = buildActionHTML(st);

  const nextBtn = document.getElementById('btnNext');
  const list = steps();
  const i = stepIndex();
  if(!state.win && i === list.length - 1){
    nextBtn.textContent = state.phase==='night' ? '进入白天' : '进入下一夜';
  }else if(i === list.length - 1 && state.win){
    nextBtn.textContent = '下一步';
  }else{
    nextBtn.textContent = '下一步';
  }
}

    if(h && !h.tags.includes('shotUsed')){
      const tag = shotHolderText(state.pendingShot.type);
      html += '<div class="action-box">'
        + '<div class="action-label">'+tag+'技能待结算</div>'
        + '<div class="hint-warn">'+tag+' '+fmtSeat(h.seat)+' 号 '+esc(h.name)+' 已出局，请选择要带走的目标；点选座位后确认。</div>'
        + (state.shotTarget

    html += box('狼美人 · 魅惑目标',
